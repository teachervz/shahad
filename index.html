<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأمن السيبراني | عرض تفاعلي</title>
<!-- خط عربي واضح (إذا لم يتوفر إنترنت سيُستخدم خط Tahoma تلقائيًا) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1) الألوان والهوية البصرية — يمكن تغيير الألوان من هنا
   ========================================================= */
:root{
  --p:#7C3AED; --p2:#8B5CF6; --pd:#5B21B6; --pdd:#2E1065;
  --ps:#EDE9FE; --pss:#F7F4FF; --line:#E4DCFB;
  --pink:#EC4899; --teal:#14B8A6; --amber:#F59E0B; --sky:#0EA5E9;
  --ok:#10B981; --okS:#E7FBF3; --bad:#F43F5E; --badS:#FFF0F3;
  --ink:#2A1454; --muted:#6B5A8E;
  --r:28px;
  --shadow:0 18px 40px -18px rgba(76,29,149,.35);
  --shadow-s:0 8px 20px -10px rgba(76,29,149,.35);
  --font:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);
  background:#1c1036;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body.idle{cursor:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;line-height:inherit}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
::-webkit-scrollbar{display:none}

/* =========================================================
   2) مسرح العرض 16:9 (1920×1080) ويتم تكبيره/تصغيره ليملأ الشاشة
   ========================================================= */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;
  transform-origin:center center;
  background:
    radial-gradient(1100px 700px at 105% -5%, #E9DDFF 0%, transparent 60%),
    radial-gradient(900px 600px at -5% 105%, #FDE3F1 0%, transparent 60%),
    #FBFAFF;}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(124,58,237,.13) 2px,transparent 2.5px);background-size:46px 46px;
  -webkit-mask-image:linear-gradient(120deg,#000 0%,transparent 45%,transparent 60%,#000 100%);
          mask-image:linear-gradient(120deg,#000 0%,transparent 45%,transparent 60%,#000 100%);}
.pgnum{position:absolute;left:44px;bottom:30px;font-size:22px;font-weight:700;color:#B7A8DA;z-index:5;direction:ltr}
.brand{position:absolute;right:44px;bottom:30px;font-size:22px;font-weight:700;color:#B7A8DA;z-index:5}

/* ---------- الشرائح وتأثيرات الانتقال ---------- */
.slide{position:absolute;inset:0;visibility:hidden;opacity:0;pointer-events:none}
.slide.active{visibility:visible;opacity:1;pointer-events:auto;z-index:3}
.slide.leaving{visibility:visible;z-index:2;animation:slideOut .45s ease forwards}
.slide.in-fade{animation:inFade .7s ease backwards}
.slide.in-zoom{animation:inZoom .75s cubic-bezier(.2,.8,.2,1) backwards}
.slide.in-slide-next{animation:inSlideN .7s cubic-bezier(.2,.8,.2,1) backwards}
.slide.in-slide-prev{animation:inSlideP .7s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes slideOut{to{opacity:0;transform:scale(.98)}}
@keyframes inFade{from{opacity:0}}
@keyframes inZoom{from{opacity:0;transform:scale(.92)}}
@keyframes inSlideN{from{opacity:0;transform:translateX(-90px)}}
@keyframes inSlideP{from{opacity:0;transform:translateX(90px)}}
/* ظهور العناصر بالتتابع */
.slide.active .rv{animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 110ms + 180ms)}
@keyframes rise{from{opacity:0;transform:translateY(34px)}}

.slide-inner{position:absolute;inset:64px 110px 110px;display:flex;flex-direction:column;gap:22px}
.content{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px;min-height:0}
.tag{align-self:flex-start;background:#fff;border:2px solid var(--line);color:var(--pd);padding:6px 26px;
  border-radius:999px;font-size:26px;font-weight:800;box-shadow:var(--shadow-s)}
.title{font-size:66px;font-weight:900;color:var(--pdd);line-height:1.25}
.title::after{content:"";display:block;width:120px;height:8px;border-radius:9px;margin-top:10px;
  background:linear-gradient(90deg,var(--pink),var(--p2))}
.lead{font-size:36px;color:var(--muted);font-weight:700;line-height:1.5}
.lead.ok-text{color:var(--ok)}
.center-row{display:flex;justify-content:center;gap:20px}

/* ---------- أزرار عامة ---------- */
.btn{font-size:30px;font-weight:800;padding:14px 38px;border-radius:999px;transition:transform .2s,box-shadow .2s,background .2s,opacity .2s}
.btn.primary{background:linear-gradient(135deg,var(--p2),var(--pd));color:#fff;box-shadow:0 12px 26px -10px rgba(109,40,217,.7)}
.btn.ghost{background:#fff;color:var(--pd);border:3px solid var(--ps);box-shadow:var(--shadow-s)}
.btn.ok{background:var(--ok);color:#fff}
.btn.lg{font-size:38px;padding:18px 54px}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes floaty{50%{transform:translateY(-18px) rotate(4deg)}}

/* ---------- بطاقة السؤال + الخيارات ---------- */
.q-card{background:#fff;border-radius:var(--r);padding:24px 36px;box-shadow:var(--shadow);display:flex;gap:22px;
  align-items:center;font-size:40px;font-weight:800;line-height:1.45;border-right:12px solid var(--p)}
.q-card.big{font-size:42px}
.q-ic{font-size:54px;flex:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.opt{position:relative;background:#fff;border:3px solid var(--line);border-radius:26px;padding:20px 28px;font-size:34px;font-weight:800;
  display:flex;align-items:center;gap:20px;text-align:right;box-shadow:var(--shadow-s);transition:transform .2s,border-color .2s,background .2s,opacity .3s}
.opt:hover{transform:translateY(-4px);border-color:var(--p2)}
.opt:active{transform:scale(.97)}
.opt-ic{font-size:42px;width:74px;height:74px;flex:none;border-radius:50%;background:var(--pss);display:flex;align-items:center;justify-content:center}
.opt.correct{background:var(--okS);border-color:var(--ok);color:#065F46}
.opt.correct::after{content:"✓";position:absolute;left:24px;font-size:44px;color:var(--ok);animation:pop .4s}
.opt.wrong{border-color:var(--bad);background:var(--badS);animation:shake .5s}
.opt.dim{opacity:.4;pointer-events:none}
.feedback{min-height:60px;font-size:40px;font-weight:900;text-align:center}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--pink)}
.feedback.pop{animation:pop .45s}
.explain{background:#FFF8EA;border:3px dashed #FCD38A;border-radius:24px;padding:16px 28px;font-size:29px;font-weight:700;line-height:1.55;
  opacity:0;transform:translateY(14px);transition:.5s}
.explain.show{opacity:1;transform:none}

.mcq{flex:1;display:flex;gap:60px;align-items:center;min-height:0}
.mcq-main{flex:1;display:flex;flex-direction:column;gap:22px}
.scene{flex:none}

/* مشهد الجوال */
.phone{width:380px;height:680px;border:14px solid #22123F;border-radius:58px;background:linear-gradient(170deg,#3B1C7A,#1A0E33);
  position:relative;box-shadow:0 30px 60px -20px rgba(40,10,90,.6);padding:70px 22px 22px;animation:floaty 5s ease-in-out infinite}
.phone::before{content:"";position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:26px;border-radius:20px;background:#22123F}
.sms-head{color:#D9CCFF;font-size:20px;font-weight:700;margin-bottom:14px;text-align:center}
.sms{background:#fff;border-radius:26px 26px 6px 26px;padding:20px;font-size:23px;line-height:1.6;font-weight:600;color:#222}
.sms .link{display:block;direction:ltr;text-align:left;color:#2563EB;text-decoration:underline;margin-top:8px;font-size:20px}
.sms-time{color:#9F8FD0;font-size:18px;margin-top:10px;text-align:left}
.scene-card{width:420px;height:520px;border-radius:40px;background:linear-gradient(160deg,var(--p2),var(--pd));color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px;box-shadow:var(--shadow)}
.scene-card .sc-big{font-size:150px;animation:floaty 4s ease-in-out infinite}
.scene-card .sc-t{font-size:36px;font-weight:900;line-height:1.4}
.scene-card .sc-s{font-size:24px;opacity:.8;direction:ltr}

/* ---------- الشريحة الترحيبية ---------- */
.hero{flex:1;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:40px}
.pill{display:inline-block;background:var(--ps);color:var(--pd);font-size:30px;font-weight:800;padding:8px 30px;border-radius:999px}
.hero-title{font-size:128px;font-weight:900;line-height:1.3;margin:14px 0 6px;padding-bottom:22px;white-space:nowrap;
  background:linear-gradient(120deg,var(--pdd),var(--p) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{font-size:44px;font-weight:700;color:var(--muted);line-height:1.5;margin-bottom:26px}
.hero-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:36px}
.hero-meta span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 24px;font-size:26px;font-weight:700;color:var(--muted)}
.hero-art{position:relative;width:600px;height:600px;justify-self:center}
.hero-art svg{width:100%;height:100%;animation:floaty 6s ease-in-out infinite}
.orbit{transform-origin:200px 200px;animation:spin 30s linear infinite}
.orbit.rev{animation-direction:reverse;animation-duration:22s}
@keyframes spin{to{transform:rotate(360deg)}}
.float{position:absolute;font-size:74px;animation:floaty 4.5s ease-in-out infinite}
.f1{top:4%;right:6%}.f2{bottom:10%;right:0;animation-delay:-1.5s}.f3{top:12%;left:2%;animation-delay:-3s}.f4{bottom:4%;left:12%;animation-delay:-2s}

/* ---------- الأهداف ---------- */
.goals{display:flex;flex-direction:column;gap:16px;width:1400px;align-self:center}
.goal{width:100%;display:flex;align-items:center;gap:24px;background:#fff;border:3px solid var(--line);border-radius:26px;
  padding:14px 28px;font-size:34px;font-weight:800;text-align:right;box-shadow:var(--shadow-s);transition:.25s}
.goal:hover{border-color:var(--p2);transform:translateX(-8px)}
.goal-n{width:62px;height:62px;border-radius:50%;background:var(--ps);color:var(--pd);display:flex;align-items:center;justify-content:center;flex:none}
.goal-ic{font-size:44px}
.goal-t{flex:1}
.goal-check{width:58px;height:58px;border-radius:50%;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;color:transparent;font-size:34px}
.goal.done{background:var(--okS);border-color:var(--ok)}
.goal.done .goal-check{background:var(--ok);border:0;color:#fff;animation:pop .4s}
.hint-sm{font-size:26px;color:#9C8BC4;font-weight:700;text-align:center}

/* ---------- العصف الذهني ---------- */
.bs{flex:1;display:flex;gap:36px;min-height:0}
.bs-side{width:560px;display:flex;flex-direction:column;gap:22px;justify-content:center}
.bs-prompt{background:#fff;border-radius:var(--r);padding:26px 30px;font-size:34px;font-weight:800;line-height:1.5;box-shadow:var(--shadow);border-right:10px solid var(--pink)}
.bs-input{display:flex;gap:12px}
.bs-input input{flex:1;min-width:0;font-size:30px;padding:12px 24px;border-radius:999px;border:3px solid var(--line);outline:none;background:#fff;color:var(--ink)}
.bs-input input:focus{border-color:var(--p2)}
.bs-btns{display:flex;gap:12px;flex-wrap:wrap}
.bs-btns .btn{font-size:26px;padding:12px 26px}
.bs-area{flex:1;position:relative;background:#fff;border-radius:36px;border:3px dashed var(--line);overflow:hidden}
.bs-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:230px;height:230px;border-radius:50%;
  background:linear-gradient(140deg,var(--p2),var(--pd));color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:34px;font-weight:900;line-height:1.3;box-shadow:0 0 0 18px var(--ps),var(--shadow);z-index:2}
.bubble{position:absolute;transform:translate(-50%,-50%);background:#fff;border:3px solid var(--c);color:var(--c);
  padding:8px 24px;border-radius:999px;font-size:28px;font-weight:800;white-space:nowrap;box-shadow:var(--shadow-s);animation:bubIn .5s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes bubIn{from{transform:translate(-50%,-50%) scale(0);opacity:0}}

/* ---------- الفراغات ---------- */
.def-card{background:#fff;border-radius:36px;padding:40px 50px;box-shadow:var(--shadow);border-top:12px solid var(--p)}
.def-src{font-size:28px;font-weight:800;color:var(--pink);margin-bottom:10px}
.def-text{font-size:42px;font-weight:700;line-height:2.1}
.blank{position:relative;display:inline-block;margin:0 6px;padding:0 18px;line-height:1.5;border-radius:16px;background:var(--pss);
  border-bottom:5px dashed var(--p2);font-size:42px;font-weight:900;transition:.3s}
.blank span{color:transparent}
.blank::after{content:"؟";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--p2)}
.blank:hover{background:var(--ps)}
.blank.open{background:#F3EDFF;border-bottom-style:solid}
.blank.open span{color:var(--pd);animation:pop .4s;display:inline-block}
.blank.open::after{content:none}
.note-card{display:flex;align-items:center;gap:26px;background:linear-gradient(135deg,#fff,var(--pss));border:3px solid var(--line);
  border-radius:30px;padding:22px 34px;font-size:30px;font-weight:700;line-height:1.55}
.note-card .ni{font-size:70px}

/* ---------- البطاقات المقلوبة ---------- */
.cards{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:28px}
.fc-wrap{perspective:1500px;height:var(--h,500px)}
.fc{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.2,.8,.2,1)}
.fc-wrap:hover .fc:not(.flipped){transform:translateY(-8px)}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center}
.fc-front{background:#fff;border:3px solid var(--line);border-top:14px solid var(--c);box-shadow:var(--shadow)}
.fc-back{transform:rotateY(180deg);color:#fff;background:var(--c);
  background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 65%,#1e0b4a));box-shadow:var(--shadow)}
.fc-ic{font-size:96px;animation:floaty 5s ease-in-out infinite}
.fc-title{font-size:36px;font-weight:900;line-height:1.35}
.fc-title.sm{font-size:30px;opacity:.9}
.fc-back p{font-size:28px;font-weight:600;line-height:1.6}
.fc-hint{font-size:22px;color:#A393CC;font-weight:700}

/* ---------- لعبة الترتيب ---------- */
.slots{display:flex;align-items:center;justify-content:center;gap:10px}
.slot{width:222px;height:170px;border:4px dashed var(--line);border-radius:26px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.6);transition:.3s}
.slot-n{font-size:64px;font-weight:900;color:#D6CCF2}
.slot.filled{border-style:solid;border-color:var(--p2);background:#fff;box-shadow:var(--shadow-s);cursor:pointer}
.slot.filled:hover{transform:translateY(-4px)}
.slot.sel{box-shadow:0 0 0 6px rgba(124,58,237,.25)}
.placed{display:flex;flex-direction:column;align-items:center;animation:pop .45s}
.placed .pi{font-size:52px}.placed b{font-size:30px}.placed small{font-size:19px;color:var(--muted);direction:ltr}
.slot-arrow{font-size:34px;color:#C9BCEB;font-weight:900}
.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;min-height:90px}
.chip-stage{font-size:32px;font-weight:800;padding:14px 32px;background:#fff;border:3px solid var(--line);border-radius:999px;box-shadow:var(--shadow-s);transition:.25s}
.chip-stage:hover{border-color:var(--p2);transform:translateY(-4px)}
.chip-stage.gone{opacity:0;transform:scale(.5);pointer-events:none}
.order-info{background:#fff;border-radius:26px;padding:20px 32px;display:flex;gap:22px;align-items:center;font-size:31px;font-weight:700;line-height:1.5;
  min-height:120px;border-right:10px solid var(--teal);box-shadow:var(--shadow-s)}
.order-info .oi-ic{font-size:54px}

/* ---------- البصمة الرقمية ---------- */
.fp-wrap{flex:1;display:flex;gap:36px;min-height:0}
.fp-side{width:640px;display:flex;flex-direction:column;gap:18px;justify-content:center}
.fp-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fp-act{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 18px;font-size:25px;font-weight:800;text-align:right;transition:.25s}
.fp-act span{font-size:36px}
.fp-act:hover{border-color:var(--p2);transform:translateY(-3px)}
.fp-act.used{background:var(--ps);opacity:.55;pointer-events:none}
.fp-board{flex:1;position:relative;background:linear-gradient(170deg,#fff,var(--pss));border:3px solid var(--line);border-radius:36px;overflow:hidden}
.fp-counter{position:absolute;top:22px;right:26px;background:#fff;border-radius:999px;padding:8px 26px;font-size:30px;font-weight:800;box-shadow:var(--shadow-s);z-index:3}
.fp-counter b{color:var(--pink);font-size:38px}
.fp-reveal{position:absolute;top:22px;left:26px;z-index:3;font-size:26px!important;padding:10px 26px!important}
.foot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;animation:bubIn .5s backwards}
.foot .fi{font-size:58px;filter:drop-shadow(0 6px 8px rgba(80,30,160,.25))}
.foot .fl{background:var(--pdd);color:#fff;font-size:20px;font-weight:700;padding:3px 14px;border-radius:999px;white-space:nowrap}
.fp-def{position:absolute;left:24px;right:24px;bottom:24px;z-index:4;background:linear-gradient(135deg,var(--p2),var(--pd));color:#fff;
  border-radius:28px;padding:24px 32px;font-size:31px;font-weight:700;line-height:1.6;transform:translateY(130%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.fp-def.show{transform:none}
.fp-def b{color:#FDE68A}

/* ---------- لعبة التصنيف ---------- */
.sort-wrap{flex:1;display:grid;grid-template-columns:1fr 620px 1fr;gap:34px;min-height:0}
.bucket{background:#fff;border:4px solid var(--c);border-radius:34px;display:flex;flex-direction:column;padding:22px;gap:14px;transition:.25s;text-align:right;overflow:hidden}
.bucket:hover{transform:translateY(-5px);box-shadow:0 20px 36px -16px var(--c)}
.bucket:active{transform:scale(.98)}
.bk-head{display:flex;align-items:center;gap:14px;font-size:36px;font-weight:900;color:var(--c)}
.bk-ic{font-size:60px}
.bk-count{margin-inline-start:auto;background:var(--c);color:#fff;border-radius:999px;min-width:64px;text-align:center;font-size:32px;padding:2px 14px}
.bk-list{display:flex;flex-direction:column;gap:8px;overflow:hidden;flex:1}
.bk-chip{font-size:22px;font-weight:700;background:var(--pss);border-right:6px solid var(--c);padding:6px 14px;border-radius:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:pop .4s}
.bk-empty{font-size:24px;color:#B5A8D6;font-weight:700;text-align:center;margin-top:30px}
.sort-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.sort-prog{font-size:28px;font-weight:800;color:var(--muted);background:#fff;padding:4px 26px;border-radius:999px;border:2px solid var(--line);direction:ltr}
.sort-card{width:100%;min-height:330px;background:linear-gradient(160deg,#fff,var(--pss));border:3px solid var(--line);border-radius:36px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:38px;font-weight:900;text-align:center;padding:30px;line-height:1.45;box-shadow:var(--shadow)}
.sort-card .sc-ic{font-size:96px}
.sort-card.enter{animation:pop .45s}
.sort-hint{font-size:25px;color:#A393CC;font-weight:700}

/* ---------- الكشف التدريجي ---------- */
.reveal-grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:26px}
.rev{position:relative;height:var(--h,300px);border-radius:var(--r);overflow:hidden;background:#fff;border:3px solid var(--line);box-shadow:var(--shadow-s);transition:transform .25s}
.rev:hover{transform:translateY(-5px)}
.rev-cover{position:absolute;inset:0;z-index:2;background:linear-gradient(140deg,var(--p2),var(--pd));color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:96px;font-weight:900;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .6s}
.rev-cover small{font-size:24px;font-weight:700;opacity:.8}
.rev:nth-child(4n+2) .rev-cover{background:linear-gradient(140deg,#F472B6,#BE185D)}
.rev:nth-child(4n+3) .rev-cover{background:linear-gradient(140deg,#2DD4BF,#0F766E)}
.rev:nth-child(4n+4) .rev-cover{background:linear-gradient(140deg,#FBBF24,#B45309)}
.rev.open .rev-cover{transform:translateY(-105%);opacity:0}
.rev-content{height:100%;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.rev-ic{font-size:66px}.rev-t{font-size:32px;font-weight:900;line-height:1.35}.rev-content p{font-size:25px;color:var(--muted);font-weight:600;line-height:1.5}

/* ---------- قيمة دينية ---------- */
.verse{position:relative;background:linear-gradient(160deg,#FFFDF5,#FFF6DD);border:3px solid #F4D58A;border-radius:36px;padding:30px 60px 24px;
  text-align:center;box-shadow:var(--shadow)}
.verse::before,.verse::after{content:"۞";position:absolute;top:50%;transform:translateY(-50%);font-size:54px;color:#D9A93A}
.verse::before{right:22px}.verse::after{left:22px}
.verse-t{font-family:'Amiri','Traditional Arabic',serif;font-size:52px;font-weight:700;line-height:1.9;color:#3B2A06}
.verse-t mark{background:linear-gradient(transparent 55%,#FDE68A 55%);color:#7C2D12;padding:0 6px;border-radius:6px}
.verse-src{font-size:26px;font-weight:800;color:#B45309;margin-top:4px}
.value-tip{font-size:30px;font-weight:800;color:var(--pd);text-align:center}

/* ---------- سجل الخادم ---------- */
.term-wrap{flex:1;display:grid;grid-template-columns:600px 1fr;gap:34px;min-height:0}
.browser{background:#fff;border-radius:26px;overflow:hidden;border:3px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.br-bar{background:#F1EDFB;padding:14px 18px;display:flex;gap:14px;align-items:center}
.dots{display:flex;gap:8px}.dots i{width:16px;height:16px;border-radius:50%;background:#F87171}.dots i:nth-child(2){background:#FBBF24}.dots i:nth-child(3){background:#34D399}
.br-url{flex:1;background:#fff;border-radius:999px;padding:4px 20px;font-size:21px;direction:ltr;text-align:left;color:var(--muted)}
.br-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:26px;text-align:center;font-size:30px;font-weight:700}
.br-ic{font-size:110px}
.terminal{background:#170D2E;border-radius:26px;color:#E9E3FF;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.term-head{background:#2A1850;padding:12px 26px;font-size:24px;font-weight:800;display:flex;justify-content:space-between}
.rec{color:#FB7185;direction:ltr}.rec.on{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.term-lines{padding:18px 28px;display:flex;flex-direction:column;gap:6px;font-size:26px}
.term-empty{color:#7C6BA8;font-size:26px;margin-top:20px}
.tl{display:flex;gap:18px;align-items:baseline;animation:typeIn .35s}
@keyframes typeIn{from{opacity:0;transform:translateX(20px)}}
.tl .k{color:#C4B5FD;min-width:240px;font-weight:700}
.tl .k::before{content:"▸ ";color:#F472B6}
.tl .v{direction:ltr;font-family:Consolas,'Courier New',monospace;color:#6EE7B7;font-weight:700}
.term-q{background:#fff;border-radius:26px;padding:16px 30px;box-shadow:var(--shadow-s);display:flex;flex-direction:column;gap:8px}
.term-q .row{display:flex;align-items:center;gap:20px;font-size:31px;font-weight:800}
.term-q .row p{flex:1}
.term-q .btn{font-size:24px;padding:8px 24px}
.term-a{font-size:28px;font-weight:700;color:var(--pd);line-height:1.55;display:none}
.term-a.show{display:block;animation:pop .4s}

/* ---------- فكّري زاوجي شاركي ---------- */
.phases{display:flex;align-items:center;justify-content:center;gap:18px}
.phase{width:450px;background:#fff;border:4px solid transparent;border-radius:32px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow);transition:.3s}
.phase:hover{transform:translateY(-5px)}
.ph-ic{font-size:70px}.ph-name{font-size:38px;font-weight:900;color:var(--c)}.ph-desc{font-size:25px;color:var(--muted);font-weight:700}
.ph-time{font-size:48px;font-weight:900;direction:ltr;color:var(--ink)}
.phase.active{border-color:var(--c);transform:scale(1.05);box-shadow:0 22px 40px -16px var(--c)}
.phase.active .ph-time{color:var(--c)}
.phase.done .ph-time::after{content:" ✓";color:var(--ok)}
.ph-arrow{font-size:40px;color:#C9BCEB;font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.chip{background:#fff;border:2px solid var(--line);padding:8px 22px;border-radius:999px;font-size:26px;font-weight:800;box-shadow:var(--shadow-s)}
.chip.lg{font-size:30px;padding:10px 28px}
.tps-chips{opacity:0;transform:translateY(10px);transition:.5s}
.tps-chips.show{opacity:1;transform:none}

/* ---------- المقارنة ---------- */
.cmp{background:#fff;border-radius:32px;padding:18px 30px;box-shadow:var(--shadow)}
.cmp-head,.cmp-row{display:grid;grid-template-columns:230px 1fr 1fr;gap:24px;align-items:center}
.cmp-col{text-align:center;padding:12px;border-radius:24px;background:var(--pss);background:color-mix(in srgb,var(--c) 10%,white)}
.cmp-ic{font-size:54px;line-height:1.2}.cmp-name{font-size:34px;font-weight:900;color:var(--c)}.cmp-an{font-size:23px;font-weight:700;color:var(--muted)}
.cmp-row{padding:14px 0;border-top:2px dashed var(--line);font-size:27px;font-weight:700;opacity:.08;transition:opacity .5s,transform .5s;transform:translateY(10px)}
.cmp-row.show{opacity:1;transform:none}
.cmp-k{font-weight:900;color:var(--pd);font-size:29px}
.cmp-v{text-align:center;line-height:1.45}

/* ---------- المطابقة ---------- */
.match{display:grid;grid-template-columns:470px 1fr;gap:0 60px}
.m-col{display:flex;flex-direction:column;gap:13px}
.m-item{position:relative;min-height:76px;background:#fff;border:3px solid var(--line);border-radius:22px;font-size:27px;font-weight:700;
  padding:8px 26px;text-align:right;display:flex;align-items:center;transition:.25s;box-shadow:var(--shadow-s)}
.m-item:hover{border-color:var(--p2)}
.m-item.term{justify-content:space-between;font-size:30px;font-weight:900;color:var(--pd);background:var(--pss)}
.m-item.term small{font-size:19px;color:var(--muted);direction:ltr;font-weight:700}
.m-item.sel{border-color:var(--p);box-shadow:0 0 0 6px rgba(124,58,237,.22);transform:scale(1.02)}
.m-item.matched{border-color:var(--mc);background:#fff;pointer-events:none;padding-left:76px}
.m-item.matched::after{content:attr(data-badge);position:absolute;left:16px;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;
  background:var(--mc);color:#fff;font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;animation:pop .4s}

/* ---------- صح أم خطأ ---------- */
.tf-list{display:flex;flex-direction:column;gap:14px}
.tf-row{display:grid;grid-template-columns:64px 1fr auto;gap:22px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:24px;padding:12px 24px;box-shadow:var(--shadow-s);transition:.3s}
.tf-n{width:56px;height:56px;border-radius:50%;background:var(--ps);color:var(--pd);font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center}
.tf-t{font-size:31px;font-weight:800;line-height:1.45}
.tf-why{font-size:23px;font-weight:700;color:var(--muted);display:none;margin-top:2px}
.tf-why.show{display:block;animation:pop .4s}
.tf-why.bad{color:var(--pink)}
.tf-btns{display:flex;gap:12px}
.tf-b{font-size:27px;font-weight:900;padding:8px 26px;border-radius:999px;border:3px solid;background:#fff;transition:.2s}
.tf-b:hover{transform:translateY(-3px)}
.tf-b.yes{color:#059669;border-color:#A7F3D0}.tf-b.no{color:#E11D48;border-color:#FECDD3}
.tf-row.solved{border-color:var(--ok);background:#F5FFFA}
.tf-row.solved .tf-n{background:var(--ok);color:#fff}
.tf-row.solved .tf-b{pointer-events:none;opacity:.35}
.tf-row.solved .tf-b.right{opacity:1;background:var(--ok);color:#fff;border-color:var(--ok)}

/* ---------- المؤقت ---------- */
.timer-box{display:flex;align-items:center;gap:16px}
.timer{position:relative;width:140px;height:140px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.tr-bg{fill:#fff;stroke:var(--ps);stroke-width:10}
.tr-fg{fill:none;stroke:var(--p);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.tr-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;direction:ltr}
.timer-box.warn .tr-fg{stroke:var(--amber)}
.timer-box.end .tr-fg{stroke:var(--bad)}
.timer-box.end .timer{animation:pulse 1s 3}
@keyframes pulse{50%{transform:scale(1.08)}}
.tr-btns{display:flex;flex-direction:column;gap:10px}
.tbtn{width:60px;height:60px;border-radius:50%;background:#fff;border:3px solid var(--line);font-size:26px;color:var(--pd);font-weight:900;transition:.2s}
.tbtn:hover{border-color:var(--p2);transform:scale(1.08)}
.timer-box.big{flex-direction:column}
.timer-box.big .timer{width:330px;height:330px}
.timer-box.big .tr-txt{font-size:92px}
.timer-box.big .tr-btns{flex-direction:row}
.timer-box.big .tbtn{width:74px;height:74px;font-size:32px}

/* ---------- التعلم التعاوني ---------- */
.grp-top{display:flex;align-items:center;justify-content:space-between;gap:30px}

/* ---------- تحدي الدقيقة ---------- */
.ch-wrap{flex:1;display:grid;grid-template-columns:440px 1fr;gap:50px;align-items:center}
.ch-left{display:flex;flex-direction:column;align-items:center;gap:24px}
.ch-score{font-size:32px;font-weight:900;background:#fff;border-radius:999px;padding:10px 32px;box-shadow:var(--shadow-s)}
.ch-score b{color:var(--ok);font-size:40px}
.ch-card{background:#fff;border-radius:36px;padding:36px 44px;min-height:360px;display:flex;flex-direction:column;justify-content:center;gap:18px;box-shadow:var(--shadow);border-top:14px solid var(--amber)}
.ch-num{font-size:26px;font-weight:800;color:var(--muted)}
.ch-q{font-size:46px;font-weight:900;line-height:1.4}
.ch-q.enter{animation:pop .4s}
.ch-a{font-size:34px;color:var(--ok);font-weight:900;opacity:0;transition:.4s;min-height:50px}
.ch-a.show{opacity:1}
.ch-btns{display:flex;gap:16px;justify-content:center;margin-top:22px}

/* ---------- خريطة المراجعة ---------- */
.map{flex:1;position:relative;min-height:0}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map line{stroke:#D5C8F5;stroke-width:3;stroke-dasharray:8 10;vector-effect:non-scaling-stroke}
.node{position:absolute;transform:translate(-50%,-50%);background:#fff;border:4px solid var(--c);color:var(--ink);border-radius:999px;padding:10px 28px;
  font-size:28px;font-weight:900;display:flex;gap:10px;align-items:center;white-space:nowrap;box-shadow:var(--shadow-s);transition:background .3s,color .3s,transform .25s}
.node:hover{transform:translate(-50%,-50%) scale(1.07)}
.node.seen{background:var(--c);color:#fff}
.map-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:560px;min-height:290px;border-radius:44px;
  background:linear-gradient(145deg,var(--p2),var(--pd));color:#fff;padding:26px 34px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:8px;box-shadow:0 0 0 16px var(--ps),var(--shadow)}
.map-center .mc-ic{font-size:58px}.map-center .mc-t{font-size:36px;font-weight:900}.map-center .mc-d{font-size:26px;font-weight:600;line-height:1.55}
.map-center.enter{animation:pop .4s}

/* ---------- فيديو ---------- */
.video-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.video-box{height:100%;max-height:690px;aspect-ratio:16/9;border-radius:32px;overflow:hidden;background:#000;
  border:8px solid #fff;box-shadow:0 0 0 4px var(--line),var(--shadow)}
.video-box video{width:100%;height:100%;display:block;background:#000;object-fit:cover}

/* ---------- اقتباس ---------- */
.quote-wrap{flex:1;display:grid;grid-template-columns:420px 1fr;gap:60px;align-items:center;min-height:0}
.q-photo{width:420px;height:525px;border-radius:40px;overflow:hidden;border:8px solid #fff;box-shadow:0 0 0 4px #D9A93A,var(--shadow);background:#111}
.q-photo img{width:100%;height:100%;object-fit:cover;display:block}
.q-box{position:relative;background:#fff;border-radius:36px;padding:44px 56px 34px;box-shadow:var(--shadow);border-right:12px solid #059669}
.q-box::before{content:"❝";position:absolute;top:-46px;right:40px;font-size:120px;line-height:1;color:#059669}
.q-text{font-size:33px;font-weight:700;line-height:1.85;color:var(--ink)}
.q-text b{color:#047857}
.q-by{margin-top:22px;padding-top:18px;border-top:3px dashed var(--line);font-size:24px;font-weight:800;color:var(--muted);line-height:1.6}
.q-by strong{display:block;font-size:30px;color:var(--pdd)}

/* ---------- شريحة عنوان قسم ---------- */
.section{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
.sec-ic{width:230px;height:230px;border-radius:50%;background:linear-gradient(140deg,var(--p2),var(--pd));display:flex;align-items:center;justify-content:center;
  font-size:120px;box-shadow:0 0 0 22px var(--ps),var(--shadow);animation:floaty 5s ease-in-out infinite}
.sec-title{font-size:130px;font-weight:900;line-height:1.3;padding-bottom:10px;background:linear-gradient(120deg,var(--pdd),var(--p) 55%,var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sec-sub{font-size:42px;font-weight:700;color:var(--muted)}

/* ---------- الختام ---------- */
.closing{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.cl-shield{font-size:140px;animation:floaty 4s ease-in-out infinite}
.cl-title{font-size:92px;font-weight:900;line-height:1.2;background:linear-gradient(120deg,var(--pdd),var(--p),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.cl-msg{font-size:38px;font-weight:700;color:var(--muted)}
.cl-tips{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;max-width:1500px}
.cl-rate{display:flex;align-items:center;gap:18px;font-size:32px;font-weight:800;background:#fff;border-radius:999px;padding:10px 20px 10px 34px;box-shadow:var(--shadow-s);margin-top:10px}
.rate{font-size:62px;transition:transform .2s;line-height:1}
.rate:hover{transform:scale(1.2) rotate(-6deg)}
.rate.on{transform:scale(1.25)}
.rate-msg{font-size:32px;font-weight:800;color:var(--pd);min-height:50px}

/* =========================================================
   3) شريط التحكم + التلميح + النقاط (خارج المسرح)
   ========================================================= */
#bar{position:fixed;left:50%;bottom:2.2vmin;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:1vmin;
  background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid #E4DCFB;
  border-radius:999px;padding:.8vmin 1.2vmin;box-shadow:0 10px 30px -10px rgba(60,20,120,.45);transition:opacity .4s,transform .4s}
#bar button{font-size:2.1vmin;font-weight:800;color:var(--pd);padding:.9vmin 2vmin;border-radius:999px;transition:background .2s,transform .15s;white-space:nowrap}
#bar button:hover{background:var(--ps)}
#bar button:active{transform:scale(.92)}
#bar button:disabled{opacity:.35;pointer-events:none}
#bar .ib{font-size:2.8vmin;padding:.4vmin 1.3vmin}
#next{background:linear-gradient(135deg,var(--p2),var(--pd))!important;color:#fff!important}
#counter{font-size:2.1vmin;font-weight:800;color:var(--muted);min-width:9vmin;text-align:center;direction:ltr}
#counter b{color:var(--pd)}
#bar .sep{width:1px;height:3.4vmin;background:#E4DCFB}
#clapBtn.pulse{animation:pop .4s}
#hint{position:fixed;top:1.8vmin;left:1.8vmin;z-index:50;display:flex;gap:1.2vmin;font-size:1.55vmin;font-weight:700;color:#6B5A8E;
  background:rgba(255,255,255,.85);border-radius:999px;padding:.6vmin 1.6vmin;transition:opacity .4s}
#hint kbd{font-family:inherit;background:var(--ps);color:var(--pd);border-radius:6px;padding:0 .6vmin;font-weight:900}
#progress{position:fixed;top:0;left:0;right:0;height:.6vmin;z-index:50;background:rgba(255,255,255,.3)}
#progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--p2));transition:width .6s cubic-bezier(.2,.8,.2,1);margin-right:auto;margin-left:0}
body.idle #bar{opacity:0;transform:translate(-50%,150%);pointer-events:none}
body.idle #hint{opacity:0}

#score{position:fixed;top:50%;left:2vmin;transform:translate(-130%,-50%);z-index:60;width:40vmin;background:#fff;border-radius:3vmin;
  box-shadow:0 20px 50px -15px rgba(60,20,120,.5);padding:2.2vmin;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
#score.open{transform:translate(0,-50%)}
.sc-head{display:flex;justify-content:space-between;align-items:center;font-size:2.8vmin;font-weight:900;color:var(--pdd);margin-bottom:1.5vmin}
.sc-head button{font-size:2.4vmin;color:var(--muted)}
.sc-row{display:flex;align-items:center;gap:1vmin;padding:1vmin 1.2vmin;border-radius:1.6vmin;margin-bottom:.8vmin;background:var(--pss);border-right:.7vmin solid var(--c)}
.sc-name{flex:1;font-size:2.2vmin;font-weight:800}
.sc-pts{font-size:3vmin;font-weight:900;color:var(--c);min-width:5vmin;text-align:center}
.sc-pts.bump{animation:pop .4s}
.sc-row button{width:4.4vmin;height:4.4vmin;border-radius:50%;background:#fff;font-size:2.6vmin;font-weight:900;color:var(--pd);border:2px solid var(--line)}
.sc-row button:hover{border-color:var(--p2)}
.crown{font-size:2.4vmin;width:3vmin;text-align:center}

#scReset{margin-top:1vmin;width:100%;font-size:1.9vmin;font-weight:800;color:var(--muted);padding:.8vmin;border-radius:1.4vmin;border:2px dashed var(--line)}

/* ---------- تنافس المجموعات ---------- */
#teams{position:fixed;top:1.4vmin;left:50%;transform:translateX(-50%);z-index:55;display:flex;gap:.7vmin;
  background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:.6vmin .8vmin;border-radius:999px;box-shadow:0 8px 24px -12px rgba(60,20,120,.45)}
.tm{display:flex;align-items:center;gap:.5vmin;background:var(--c);color:#fff;border-radius:999px;padding:.35vmin 1.1vmin .35vmin .8vmin;font-size:2vmin;font-weight:900;min-width:7vmin;justify-content:center;transition:transform .2s}
.tm:hover{transform:translateY(-2px)}
.tm .tm-ic{font-size:2.1vmin}
.tm b{direction:ltr}
.tm.lead{box-shadow:0 0 0 .35vmin #fff,0 0 0 .7vmin var(--c)}
.tm.bump{animation:pop .5s}
#award{position:fixed;left:50%;bottom:11vmin;transform:translate(-50%,40px) scale(.9);opacity:0;pointer-events:none;z-index:70;
  background:#fff;border-radius:3vmin;padding:1.6vmin 2vmin;box-shadow:0 24px 60px -15px rgba(60,20,120,.55);border:2px solid var(--line);
  transition:transform .4s cubic-bezier(.2,1.4,.5,1),opacity .3s}
#award.open{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto}
.aw-head{display:flex;align-items:center;gap:1.2vmin;font-size:2.6vmin;font-weight:900;color:var(--pdd);margin-bottom:1.2vmin;justify-content:center}
#awPts{background:var(--ok);color:#fff;border-radius:999px;padding:0 1.4vmin;direction:ltr}
#awClose{margin-inline-start:auto;font-size:2.2vmin;color:var(--muted);padding:0 .6vmin}
#awBtns{display:flex;gap:1vmin}
#awBtns button{width:10vmin;display:flex;flex-direction:column;align-items:center;gap:.3vmin;padding:1vmin .4vmin;border-radius:2vmin;
  background:var(--c);color:#fff;transition:transform .2s;box-shadow:0 8px 16px -8px var(--c)}
#awBtns button:hover{transform:translateY(-5px) scale(1.05)}
#awBtns span{font-size:4vmin;line-height:1.1}
#awBtns small{font-size:1.8vmin;font-weight:900}

.hero-teams{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:-16px 0 30px;font-size:24px}
.hero-teams b{color:var(--pd);margin-left:6px}
.hero-teams span{background:var(--c);color:#fff;border-radius:999px;padding:3px 16px;font-weight:800;font-size:22px}
.grp8{gap:22px}
.grp8 .fc-ic{font-size:64px}
.grp8 .fc-title{font-size:32px}
.grp8 .fc-front{gap:6px;padding:18px}
.grp8 .fc-back{padding:22px}
.grp8 .fc-back p{font-size:25px;line-height:1.55}

.lb{display:flex;flex-direction:column;gap:12px;width:1500px;align-self:center}
.lb-row{display:grid;grid-template-columns:70px 250px 1fr 90px;gap:20px;align-items:center;background:#fff;border-radius:22px;padding:8px 22px;box-shadow:var(--shadow-s);border-right:10px solid var(--c)}
.lb-pos{font-size:34px;font-weight:900;color:var(--muted);text-align:center}
.lb-name{font-size:32px;font-weight:900;color:var(--c)}
.lb-track{height:34px;background:var(--pss);border-radius:999px;overflow:hidden}
.lb-bar{height:100%;background:var(--c);border-radius:999px;transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.lb-pts{font-size:38px;font-weight:900;text-align:center;direction:ltr}
.lb-row.win{transform:scale(1.03);box-shadow:0 0 0 5px var(--c),var(--shadow)}
.lb-row.win .lb-pos{font-size:44px}

/* ---------- بيانات النشاط (ورقة عمل) ---------- */
.act{display:flex;gap:12px;flex-wrap:wrap;margin-top:-6px}
.act span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 20px;font-size:23px;font-weight:800;color:var(--muted)}
.act b{color:var(--pd)}

/* ---------- الغلاف ---------- */
.cover-bg{position:absolute;inset:-64px -110px -110px;background:#0b2a33 center/cover no-repeat;z-index:0}
.cover-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(23,12,58,.92) 0%,rgba(46,16,101,.75) 45%,rgba(46,16,101,.15) 100%)}
.cover{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;color:#fff;max-width:1100px}
.cover .pill{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.35)}
.cover-title{font-size:150px;font-weight:900;line-height:1.2;text-shadow:0 10px 40px rgba(0,0,0,.35)}
.cover-chap{display:flex;align-items:center;gap:24px;font-size:44px;font-weight:800}
.cover-chap b{width:130px;height:130px;border-radius:50%;background:linear-gradient(140deg,var(--pink),var(--p));display:flex;align-items:center;justify-content:center;
  font-size:80px;box-shadow:0 0 0 14px rgba(255,255,255,.15)}
.cover-teacher{font-size:32px;font-weight:700;opacity:.85}

/* ---------- شريط الذكريات ---------- */
.film{position:relative;background:#1b1230;border-radius:18px;padding:34px 30px;display:flex;gap:30px;justify-content:center;
  box-shadow:var(--shadow);animation:filmIn 1.1s cubic-bezier(.2,.8,.2,1) backwards}
.film::before,.film::after{content:"";position:absolute;left:18px;right:18px;height:14px;
  background:linear-gradient(90deg,#FBFAFF 0 24px,transparent 24px) repeat-x;background-size:52px 14px;opacity:.85}
.film::before{top:10px}.film::after{bottom:10px}
@keyframes filmIn{from{transform:translateX(-120%)}}
.frame{position:relative;width:440px;height:190px;border-radius:12px;border:5px solid transparent;color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 55%,#1e0b4a));
  filter:saturate(.55) brightness(.85);transition:.35s}
.frame:hover{filter:none;transform:translateY(-4px)}
.frame.on{filter:none;border-color:#FDE68A;transform:scale(1.05);box-shadow:0 0 30px rgba(253,230,138,.45)}
.frame .fr-ic{font-size:64px;line-height:1.1}
.frame .fr-t{font-size:30px;font-weight:900}
.frame .fr-n{position:absolute;top:8px;left:14px;font-size:20px;font-weight:800;opacity:.8;direction:ltr}
.film-panel{flex:1;min-height:0;background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:26px 40px;display:flex;flex-direction:column;justify-content:center}
.fpane{display:none;flex-direction:column;gap:18px}
.fpane.on{display:flex;animation:pop .45s}
.fpane .opt{font-size:28px;padding:12px 24px}
.fpane .opt-ic{width:58px;height:58px;font-size:30px}
.fpane .feedback{min-height:46px;font-size:34px}
.fpane .q-card{box-shadow:none;background:var(--pss);font-size:34px;padding:16px 30px}
.fpane-intro{text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.fpane-intro .fi-ic{font-size:110px;animation:floaty 5s ease-in-out infinite}
.fpane-intro h3{font-size:58px;font-weight:900;color:var(--pdd)}
.fpane-intro p{font-size:32px;font-weight:700;color:var(--muted)}

/* ---------- خريطة دروس الفصل ---------- */
.lessons{display:flex;align-items:center;justify-content:center;gap:0}
.lsn{position:relative;width:440px;height:380px;background:#fff;border:3px solid var(--line);border-radius:34px;box-shadow:var(--shadow-s);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.lsn .ls-n{font-size:28px;font-weight:800;color:var(--muted)}
.lsn .ls-ic{font-size:92px;line-height:1.15}
.lsn .ls-t{font-size:40px;font-weight:900;color:var(--pdd)}
.lsn.done{opacity:.75}
.lsn.done::after{content:"✓";position:absolute;top:18px;left:22px;width:52px;height:52px;border-radius:50%;background:var(--ok);color:#fff;font-size:30px;font-weight:900;display:flex;align-items:center;justify-content:center}
.lsn.now{background:linear-gradient(150deg,var(--p2),var(--pd));border-color:transparent;transform:scale(1.08);box-shadow:0 0 0 14px var(--ps),var(--shadow);animation:nowPulse 2.4s ease-in-out infinite}
.lsn.now .ls-n,.lsn.now .ls-t{color:#fff}
.lsn .ls-badge{position:absolute;top:-26px;background:var(--pink);color:#fff;font-size:24px;font-weight:900;padding:6px 22px;border-radius:999px;box-shadow:var(--shadow-s)}
@keyframes nowPulse{50%{box-shadow:0 0 0 26px rgba(237,233,254,.6),var(--shadow)}}
.ls-link{width:90px;height:6px;background:repeating-linear-gradient(90deg,#C9BCEB 0 14px,transparent 14px 24px)}
.chap-pill{align-self:center;font-size:36px}

/* ---------- نواتج التعلم ---------- */
.outs{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px}
.outs .goal{font-size:28px;padding:12px 22px;gap:18px}
.outs .goal-n{width:52px;height:52px;font-size:26px}
.outs .goal-check{width:48px;height:48px;font-size:28px}
.outs .goal b{color:var(--p)}
.outs>div:last-child:nth-child(odd){grid-column:1/-1;width:50%;justify-self:center}

/* ---------- استراتيجية البحث (محادثة) ---------- */
.rs{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:40px;min-height:0}
.rs-side{display:flex;flex-direction:column;gap:22px;justify-content:center}
.rs-side .def-card{padding:30px 40px}
.rs-side .def-text{font-size:38px;line-height:1.8}
.rs-side .def-text b{color:var(--p)}
.rs-task{display:flex;gap:20px;align-items:center;background:#fff;border-radius:26px;padding:22px 30px;font-size:32px;font-weight:800;line-height:1.55;
  border-right:10px solid var(--pink);box-shadow:var(--shadow-s)}
.rs-task .ni{font-size:64px}
.gpt{background:#fff;border-radius:28px;border:3px solid #E5E5E5;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;color:#0d0d0d}
.gpt-head{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:2px solid #EFEFEF;font-size:28px;font-weight:800}
.gpt-logo{width:46px;height:46px;border-radius:50%;background:#0d0d0d;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px}
.gpt-head small{margin-inline-start:auto;font-size:20px;color:#8E8E8E;direction:ltr}
.gpt-body{flex:1;padding:22px 26px;display:flex;flex-direction:column;gap:16px;overflow:hidden;font-size:26px;line-height:1.65}
.gpt-empty{margin:auto;text-align:center;color:#8E8E8E;font-size:30px;font-weight:700}
.gpt-u{align-self:flex-start;background:#F1F1F1;border-radius:24px;padding:10px 24px;font-weight:700;max-width:85%;animation:pop .35s}
.gpt-a{display:flex;gap:14px;align-items:flex-start;font-weight:600;animation:typeIn .35s}
.gpt-a .gpt-logo{width:40px;height:40px;font-size:22px;flex:none}
.gpt-a b{color:#0d0d0d}
.gpt-dots::after{content:"●●●";letter-spacing:4px;color:#B4B4B4;animation:blink 1s infinite}
.gpt-foot{padding:14px 20px;border-top:2px solid #EFEFEF;display:flex;gap:12px;flex-wrap:wrap}
.gpt-foot button{flex:1;font-size:24px;font-weight:800;padding:12px 18px;border-radius:999px;background:#F4F4F4;border:2px solid #E5E5E5;transition:.2s}
.gpt-foot button:hover{background:#ECECEC;transform:translateY(-2px)}
.gpt-foot button:disabled{opacity:.4;pointer-events:none}
.gpt-open{text-decoration:none;align-self:flex-start}

/* ---------- رتّبي الكلمات ---------- */
.wo-bank{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;min-height:84px;background:rgba(255,255,255,.7);border:3px dashed var(--line);border-radius:30px;padding:16px}
.t-wordorder .lead{font-size:28px}
.t-wordorder .def-card{padding:24px 44px}
.t-wordorder .def-text{font-size:38px;line-height:1.95}
.t-wordorder .blank{font-size:38px;margin:0 4px}
.t-wordorder .bk{white-space:nowrap}
.t-wordorder .note-card{font-size:25px;padding:14px 30px}
.t-wordorder .note-card .ni{font-size:54px}
.blank.next{background:var(--ps);box-shadow:0 0 0 5px rgba(124,58,237,.25);animation:pulse 1.4s infinite}

/* ---------- ربط بالرياضيات ---------- */
.math-q{border-right-color:var(--amber)}
.math-q b{color:#B45309}
.math-link{background:linear-gradient(135deg,var(--p2),var(--pd));color:#fff;border-radius:28px;padding:20px 34px;font-size:32px;font-weight:800;line-height:1.55;
  display:none;gap:18px;align-items:center}
.math-link.show{display:flex;animation:pop .45s}
.math-link .ni{font-size:56px}
.t-math .rev-t{font-size:30px}
.t-math .rev-content p{font-size:40px;font-weight:900;color:var(--pdd);direction:rtl}

/* ---------- اكتشاف المغالطة ---------- */
.fal-top{display:flex;align-items:center;justify-content:space-between;gap:30px}
.fal-list{display:flex;flex-direction:column;gap:22px}
.fal{display:grid;grid-template-columns:64px 1fr auto;gap:22px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:28px;padding:20px 28px;box-shadow:var(--shadow-s)}
.fal-t{font-size:33px;font-weight:800;line-height:1.6}
.fal .err{border-radius:8px;transition:.3s}
.fal.open .err{background:var(--badS);color:var(--bad);text-decoration:line-through 4px}
.fal-fix{display:none;margin-top:8px;font-size:31px;font-weight:800;color:#065F46;background:var(--okS);border-radius:16px;padding:8px 18px;line-height:1.6}
.fal-fix b{color:var(--ok)}
.fal.open{border-color:var(--ok)}
.fal.open .fal-fix{display:block;animation:pop .4s}
.fal .btn{font-size:24px;padding:10px 24px}

/* ---------- نشاط (ورقة عمل) ---------- */
.actv{flex:1;display:grid;grid-template-columns:1fr 300px;gap:40px;min-height:0;align-items:center}
.actv-main{display:flex;flex-direction:column;gap:20px}
.actv-side{display:flex;flex-direction:column;align-items:center;gap:22px}
.actv-side .timer-box.big .timer{width:250px;height:250px}
.actv-side .timer-box.big .tr-txt{font-size:72px}
.actv .explain{font-size:30px}
.actv .chips{opacity:0;transform:translateY(10px);transition:.5s;justify-content:flex-start}
.actv .chips.show{opacity:1;transform:none}
.hadith{position:relative;background:linear-gradient(160deg,#FFFDF5,#FFF6DD);border:3px solid #F4D58A;border-radius:28px;padding:16px 32px}
.hadith p{font-family:'Amiri','Traditional Arabic',serif;font-size:34px;font-weight:700;line-height:1.75;color:#3B2A06}
.hadith p mark{background:linear-gradient(transparent 55%,#FDE68A 55%);color:#7C2D12;padding:0 4px}
.hadith small{font-size:22px;font-weight:800;color:#B45309}
.story{display:flex;gap:26px;align-items:center;background:#fff;border-radius:30px;padding:26px 34px;box-shadow:var(--shadow);border:3px solid var(--line)}
.story .st-ic{font-size:110px;flex:none;animation:floaty 5s ease-in-out infinite}
.story p{font-size:38px;font-weight:800;line-height:1.6}
.read-box{display:flex;gap:22px;align-items:center;background:#fff;border-radius:26px;padding:20px 30px;font-size:32px;font-weight:800;line-height:1.55;box-shadow:var(--shadow-s);border-right:10px solid var(--teal)}
.read-box .ni{font-size:70px}

/* ---------- عجلة الأسماء ---------- */
.wheel{display:flex;flex-direction:column;align-items:center;gap:14px}
.wh-box{position:relative;width:var(--ws,540px);height:var(--ws,540px)}
.wh-box canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 10px #fff,0 0 0 14px var(--line),var(--shadow);transition:transform 5.2s cubic-bezier(.12,.7,.1,1)}
.wh-ptr{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;
  border-top:50px solid var(--pink);filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));z-index:2}
.wh-hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;background:linear-gradient(140deg,var(--p2),var(--pd));
  color:#fff;font-size:30px;font-weight:900;box-shadow:0 0 0 8px #fff,var(--shadow-s);z-index:2;transition:transform .2s}
.wh-hub:hover{transform:translate(-50%,-50%) scale(1.06)}
.wh-hub:disabled{opacity:.8}
.wh-res{min-height:62px;font-size:38px;font-weight:900;color:var(--pd);text-align:center}
.wh-res.pop{animation:pop .5s}
.wh-opts{display:flex;gap:18px;align-items:center;font-size:22px;font-weight:700;color:var(--muted)}
.wh-opts input{width:22px;height:22px;accent-color:var(--p)}
.wh-opts button{font-size:22px;font-weight:800;color:var(--pd);border:2px solid var(--line);border-radius:999px;padding:2px 16px;background:#fff}
.cards-wheel{flex:1;display:grid;grid-template-columns:1fr 600px;gap:40px;align-items:center;min-height:0}
.cards-wheel .cards{grid-template-columns:1fr 1fr}
#wheelModal{position:absolute;inset:0;z-index:40;background:rgba(27,18,48,.8);display:none;align-items:center;justify-content:center}
#wheelModal.open{display:flex;animation:inFade .3s}
#wheelModal .wm-box{background:#FBFAFF;border-radius:44px;padding:50px 70px 30px;position:relative;box-shadow:var(--shadow)}
#wheelModal .wm-close{position:absolute;top:18px;left:24px;font-size:34px;color:var(--muted)}

/* ---------- ترتيب مع مهام المجموعات ---------- */
.ord-top{display:flex;align-items:center;justify-content:space-between;gap:30px}
.ord-top .lead{font-size:31px;line-height:1.5}
.slots.compact .slot{height:130px;width:210px}
.slots.compact .placed .pi{font-size:40px}.slots.compact .placed b{font-size:27px}
.order-info.sm{min-height:0;padding:12px 26px;font-size:26px}
.order-info.sm .oi-ic{font-size:40px}
.grp-mini{--h:118px;gap:16px}
.grp-mini .fc-front{flex-direction:row;gap:14px;padding:12px;border-top-width:0;border-right:12px solid var(--c)}
.grp-mini .fc-ic{font-size:46px;animation:none}
.grp-mini .fc-title{font-size:28px}
.grp-mini .fc-hint{font-size:18px}
.grp-mini .fc-back{padding:10px 18px}
.grp-mini .fc-back p{font-size:22px;line-height:1.45}

/* ---------- لعبة التقويم الختامي ---------- */
.qz{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;min-height:0}
.qz-start,.qz-end{display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}
.qz-start .qs-ic,.qz-end .qs-ic{font-size:150px;animation:floaty 4s ease-in-out infinite}
.qz-start p,.qz-end p{font-size:38px;font-weight:800;color:var(--muted)}
.qz-play{display:none;flex-direction:column;gap:18px}
.qz.playing .qz-play{display:flex}
.qz.playing .qz-start,.qz.playing .qz-end,.qz .qz-end{display:none}
.qz.ended .qz-end{display:flex}
.qz.ended .qz-start{display:none}
.qz-meta{display:flex;align-items:center;gap:24px}
.qz-dots{display:flex;gap:10px}
.qz-dots i{width:26px;height:26px;border-radius:50%;background:var(--ps);border:3px solid var(--line)}
.qz-dots i.cur{background:var(--p2);border-color:var(--p2);transform:scale(1.2)}
.qz-dots i.ok{background:var(--ok);border-color:var(--ok)}
.qz-dots i.miss{background:var(--bad);border-color:var(--bad)}
.qz-bar{flex:1;height:22px;background:var(--ps);border-radius:999px;overflow:hidden}
.qz-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--amber),var(--ok));border-radius:999px;transition:width 1s linear}
.qz-sec{font-size:36px;font-weight:900;direction:ltr;min-width:80px;text-align:center}
.qz-nav{display:flex;justify-content:center;gap:20px;min-height:76px}

/* ---------- الواجب ---------- */
.hw{flex:1;display:grid;grid-template-columns:.8fr 1.35fr;gap:44px;min-height:0;align-items:center}
.hw-steps{display:flex;flex-direction:column;gap:18px}
.hw-step{display:flex;gap:20px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:24px;padding:16px 26px;font-size:31px;font-weight:800;box-shadow:var(--shadow-s)}
.hw-step .goal-n{width:58px;height:58px}
.hw-book{display:flex;gap:16px;align-items:center;font-size:27px;font-weight:800;color:var(--muted)}
.hw-book img{height:150px;border-radius:16px;border:3px solid var(--line);background:#fff}
.board{background:#F5F7FA;border-radius:28px;border:3px solid #E2E8F0;box-shadow:var(--shadow);overflow:hidden}
.bd-head{background:linear-gradient(135deg,#0F766E,#115E59);color:#fff;padding:16px 28px;font-size:30px;font-weight:900;display:flex;align-items:center;gap:14px}
.bd-head small{margin-inline-start:auto;font-size:22px;opacity:.85}
.bd-body{padding:22px;display:flex;flex-direction:column;gap:16px}
.bd-post{background:#fff;border-radius:20px;padding:18px 22px;border:2px solid #E2E8F0}
.bd-who{display:flex;align-items:center;gap:14px;font-size:24px;font-weight:800;margin-bottom:8px}
.bd-av{width:54px;height:54px;border-radius:50%;background:#CCFBF1;display:flex;align-items:center;justify-content:center;font-size:30px}
.bd-who small{display:block;font-size:18px;color:#94A3B8;font-weight:700}
.bd-q{font-size:29px;font-weight:800;line-height:1.55;color:#0F172A}
.bd-reply{display:flex;gap:12px;align-items:center;margin-inline-start:40px}
.bd-reply .bd-av{width:44px;height:44px;font-size:24px;background:var(--ps)}
.bd-line{flex:1;display:flex;flex-direction:column;gap:8px;background:#fff;border-radius:16px;padding:12px 18px;border:2px solid #E2E8F0}
.bd-line i{display:block;height:12px;border-radius:9px;background:#E2E8F0}
.bd-input{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid #CBD5E1;border-radius:999px;padding:8px 10px 8px 22px;font-size:24px;color:#94A3B8;font-weight:700}
.bd-input span{flex:1}
.bd-input b{background:#0F766E;color:#fff;border-radius:999px;padding:6px 22px;font-size:22px}
.hw-img{width:100%;border-radius:28px;box-shadow:var(--shadow);border:3px solid var(--line);cursor:zoom-in}
.hw-steps{gap:14px}
.hw-step{font-size:27px;padding:10px 20px;gap:16px}
.hw-step .goal-n{width:48px;height:48px;font-size:24px}
.hw-book{font-size:24px}
.hw-book img{height:110px}
.hw-zoom{position:absolute;inset:-64px -110px -110px;z-index:20;background:rgba(27,18,48,.9);display:none;align-items:center;justify-content:center;cursor:zoom-out}
.hw-zoom.show{display:flex;animation:inFade .3s}
.hw-zoom img{max-width:94%;max-height:92%;border-radius:24px;box-shadow:var(--shadow)}

.hadith p{font-size:29px;line-height:1.65}
.hadith{padding:10px 28px}
.actv:has(.hadith) .q-card{font-size:34px;padding:16px 30px}
.actv:has(.hadith) .chip.lg{font-size:25px;padding:6px 20px}

/* ---------------- 🔊 الأصوات (Web Audio API — بدون ملفات خارجية) ---------------- */
const sound = (() => {
  let ctx, master, noiseBuf;
  function ac(){
    if(!ctx){
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createDynamicsCompressor(); master.connect(ctx.destination);
    }
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, t, dur, type='sine', vol=.18, toFreq){
    const c=ac(), o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(toFreq) o.frequency.exponentialRampToValueAtTime(toFreq,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(master); o.start(t); o.stop(t+dur+.05);
  }
  function noise(){
    const c=ac();
    if(!noiseBuf){ noiseBuf=c.createBuffer(1,c.sampleRate*.25,c.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    return noiseBuf;
  }
  // صفقة واحدة: ضجيج قصير مُرشَّح
  function clapOne(t, vol){
    const c=ac(), src=c.createBufferSource(); src.buffer=noise();
    const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900+Math.random()*1500; bp.Q.value=.8;
    const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=400;
    const g=c.createGain();
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.003);
    g.gain.exponentialRampToValueAtTime(.0001,t+.07+Math.random()*.06);
    src.connect(hp).connect(bp).connect(g).connect(master); src.start(t, Math.random()*.1); src.stop(t+.2);
  }
  return {
    ac,
    // 👏 تصفيق جماعي قصير (~1.8 ثانية)
    clap(){
      const c=ac(), now=c.currentTime+.02;
      for(let p=0;p<7;p++){
        let t=now+Math.random()*.18; const period=.15+Math.random()*.09;
        while(t<now+1.8){ const fade=Math.max(.1,1-(t-now)/2); clapOne(t,.9*fade*(.55+Math.random()*.45)); t+=period*(.85+Math.random()*.3); }
      }
    },
    success(){ const t=ac().currentTime; [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*.09,.35,'triangle',.2)); tone(2093,t+.38,.5,'sine',.07); },
    wrong(){ const t=ac().currentTime; tone(392,t,.2,'sine',.13); tone(311,t+.16,.32,'sine',.13); },
    ding(){ const t=ac().currentTime; tone(880,t,.25,'sine',.16); tone(1320,t+.06,.3,'sine',.1); },
    pop(){ const t=ac().currentTime; tone(420,t,.12,'sine',.18,980); },
    flip(){ const t=ac().currentTime; tone(700,t,.14,'triangle',.08,320); },
    tick(){ const t=ac().currentTime; tone(1200,t,.04,'square',.04); },
    bell(){ const t=ac().currentTime; [0,.45,.9].forEach(d=>{ tone(988,t+d,.9,'sine',.2); tone(1480,t+d,.6,'sine',.08); }); }
  };
})();

const confetti = (() => {
  const cv=$('#fx'), cx=cv.getContext('2d'); let parts=[], running=false, dpr=1;
  const size=()=>{ dpr=window.devicePixelRatio||1; cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; };
  size(); addEventListener('resize',size);
  const colors=['#7C3AED','#A78BFA','#EC4899','#F9A8D4','#14B8A6','#FBBF24','#38BDF8'];
  function add(x,y,vx,vy){ parts.push({x,y,vx,vy,s:7+Math.random()*9,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:colors[Math.random()*colors.length|0],life:0,max:110+Math.random()*70,circle:Math.random()<.3}); }
  function loop(){
    running=true; cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(p=>p.life<p.max && p.y<innerHeight+40);
    for(const p of parts){
      p.life++; p.vy+=.32; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      cx.save(); cx.globalAlpha=Math.min(1,(p.max-p.life)/30); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
      if(p.circle){ cx.beginPath(); cx.arc(0,0,p.s/2,0,7); cx.fill(); } else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      cx.restore();
    }
    if(parts.length) requestAnimationFrame(loop); else { running=false; cx.clearRect(0,0,innerWidth,innerHeight); }
  }
  return {
    burst(x,y,n=90){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=4+Math.random()*11; add(x,y,Math.cos(a)*v,Math.sin(a)*v-6); } if(!running) loop(); },
    rain(n=160){ for(let i=0;i<n;i++) add(Math.random()*innerWidth,-20-Math.random()*300,(Math.random()-.5)*4,Math.random()*3); if(!running) loop(); }
  };
})();

/* ---------------- ⏱️ المؤقت ---------------- */
class Countdown{
  constructor(sec,onTick,onEnd){ this.total=sec; this.left=sec; this.onTick=onTick; this.onEnd=onEnd; this.id=null; }
  get running(){ return !!this.id; }
  start(){ if(this.id||this.left<=0) return; this.id=setInterval(()=>{ this.left--; this.onTick(this.left); if(this.left<=0){ this.stop(); this.onEnd&&this.onEnd(); } },1000); }
  stop(){ clearInterval(this.id); this.id=null; }
  reset(){ this.stop(); this.left=this.total; this.onTick(this.left); }
}
function mountTimer(slot, sec, opts={}){
  const C=2*Math.PI*52;
  slot.innerHTML=`<div class="timer-box ${opts.big?'big':''}"><div class="timer"><svg viewBox="0 0 120 120"><circle class="tr-bg" cx="60" cy="60" r="52"/><circle class="tr-fg" cx="60" cy="60" r="52"/></svg><div class="tr-txt">${fmt(sec)}</div></div>
    <div class="tr-btns"><button class="tbtn t-play" title="تشغيل/إيقاف">▶</button><button class="tbtn t-reset" title="إعادة">↺</button></div></div>`;
  const box=$('.timer-box',slot), fg=$('.tr-fg',slot), txt=$('.tr-txt',slot), play=$('.t-play',slot);
  fg.style.strokeDasharray=C; fg.style.strokeDashoffset=0;
  const draw=l=>{ txt.textContent=fmt(l); fg.style.strokeDashoffset=C*(1-l/sec); box.classList.toggle('warn',l<=10&&l>0); };
  const cd=new Countdown(sec, l=>{ draw(l); if(l<=5&&l>0) sound.tick(); },
    ()=>{ box.classList.add('end'); play.textContent='▶'; sound.bell(); opts.onEnd&&opts.onEnd(); });
  play.onclick=()=>{
    sound.ac();
    if(cd.running){ cd.stop(); play.textContent='▶'; }
    else { if(cd.left<=0){ cd.reset(); box.classList.remove('end'); } cd.start(); play.textContent='⏸'; opts.onStart&&opts.onStart(); }
  };
  $('.t-reset',slot).onclick=()=>{ cd.reset(); box.classList.remove('end','warn'); play.textContent='▶'; opts.onReset&&opts.onReset(); };
  return cd;
}

      <p class="def-text">${s.text.replace(/\[(.+?)\]/g,(_,w)=>`<button class="blank"><span>${w}</span></button>`)}</p></div>
    <div class="center-row rv"><button class="btn ghost bl-all">👀 إظهار الكل</button></div>
    ${s.note?`<div class="note-card rv">${s.note}</div>`:''}`,
  init:sec=>{
    const open=b=>{ if(b.classList.contains('open')) return; b.classList.add('open'); sound.pop(); if($$('.blank:not(.open)',sec).length===0) celebrate($('.def-card',sec)); };
    $$('.blank',sec).forEach(b=>b.onclick=()=>open(b));
    $('.bl-all',sec).onclick=()=>$$('.blank',sec).forEach((b,i)=>setTimeout(()=>open(b),i*180));
  }
};

/* بطاقات مقلوبة (تُستخدم أيضًا للمجموعات) */
function flipInit(sec){ $$('.fc',sec).forEach(c=>c.onclick=()=>{ c.classList.toggle('flipped'); sound.flip(); }); }
R.cards = {
  html:s=>{
    const cards=`<div class="cards" style="--n:${s.cards.length};${s.h?`--h:${s.h}px`:''}">${s.cards.map(c=>`<div class="fc-wrap rv"><button class="fc" style="--c:${c.color||'#7C3AED'}">
      <div class="fc-face fc-front"><div class="fc-ic">${c.icon}</div><div class="fc-title">${c.title}</div><div class="fc-hint">اضغطي للقلب ↻</div></div>
      <div class="fc-face fc-back"><div class="fc-title sm">${c.icon} ${c.title}</div><p>${c.text}</p></div></button></div>`).join('')}</div>`;
    const sub=s.subtitle?`<p class="lead rv">${s.subtitle}</p>`:'';
    return s.wheel ? `<div class="cards-wheel"><div style="display:flex;flex-direction:column;gap:22px">${sub}${cards}</div><div class="wheel-slot rv"></div></div>` : sub+cards;
  },
  init:(sec,s)=>{ flipInit(sec); if(s.wheel) mountWheel($('.wheel-slot',sec)); }
};

/* لعبة الترتيب */
R.order = {
  html:s=>`${s.seconds?`<div class="ord-top rv"><p class="lead">${s.prompt}</p><div class="timer-slot"></div></div>`:`<p class="lead rv">${s.prompt}</p>`}
    <div class="slots rv ${s.tasks?'compact':''}">${s.items.map((_,k)=>`<div class="slot" data-k="${k}"><span class="slot-n">${k+1}</span></div>`).join('<span class="slot-arrow">←</span>')}</div>
    <div class="pool rv"></div>
    <div class="order-info rv ${s.tasks?'sm':''}"><span class="oi-ic">🛡️</span><p>كل مرحلة تضعينها في مكانها الصحيح ستكشف دور الأمن السيبراني فيها.</p></div>
    ${s.tasks?`<div class="cards grp-mini rv" style="--n:3">${LESSON.teams.map((g,k)=>`<div class="fc-wrap"><button class="fc" style="--c:${g.color}">
      <div class="fc-face fc-front"><div class="fc-ic">${g.icon}</div><div><div class="fc-title">${g.name}</div><div class="fc-hint">اضغطي لكشف المهمة 🎯</div></div></div>
      <div class="fc-face fc-back"><p>${s.tasks[k]||''}</p></div></button></div>`).join('')}</div>`:''}`,
  init:(sec,s)=>{
    if(s.tasks) flipInit(sec);
    if(s.seconds) mountTimer($('.timer-slot',sec), s.seconds);
    const pool=$('.pool',sec), info=$('.order-info p',sec), slots=$$('.slot',sec); let idx=0;
    let order=s.items.map((_,k)=>k); do{ shuffle(order); }while(order.every((v,i)=>v===i));
    order.forEach(k=>{
      const it=s.items[k], b=document.createElement('button'); b.className='chip-stage'; b.innerHTML=`${it.icon} ${it.t}`;
      b.onclick=()=>{
        if(k===idx){
          const sl=slots[k]; sl.classList.add('filled'); sl.innerHTML=`<div class="placed"><span class="pi">${it.icon}</span><b>${it.t}</b><small>${it.en||''}</small></div>`;
          sl.onclick=()=>{ slots.forEach(x=>x.classList.remove('sel')); sl.classList.add('sel'); info.innerHTML=it.info; };
          b.classList.add('gone'); info.innerHTML=it.info; idx++;
          if(s.pointEach) showAward();
          if(idx===s.items.length){ info.innerHTML='🎉 <b>'+MSG.allDone+'</b> — اضغطي على أي مرحلة لمراجعة دور الأمن فيها.'; celebrate($('.slots',sec), s.pointEach); }
          else sound.ding();
        } else { shake(b); sound.wrong(); info.innerHTML='🤔 ليست هذه المرحلة التالية… فكّري: ماذا نفعل قبل ذلك؟ '+MSG.wrong; }
      };
      pool.appendChild(b);
    });
  }
};

/* البصمة الرقمية */
R.footprints = {
  html:s=>`<div class="fp-wrap">
    <div class="fp-side"><p class="lead rv" style="font-size:30px">${s.prompt}</p>
      <div class="fp-actions rv">${s.actions.map((a,k)=>`<button class="fp-act" data-k="${k}"><span>${a.icon}</span>${a.t}</button>`).join('')}</div></div>
    <div class="fp-board rv"><div class="fp-counter">👣 الآثار: <b>0</b></div>
      <button class="btn primary fp-reveal">🔍 ماذا نسمّي هذه الآثار؟</button>
      <div class="fp-def">${s.reveal}</div></div></div>`,
  init:sec=>{
    const board=$('.fp-board',sec), cnt=$('.fp-counter b',sec);
    const pos=[[86,82],[72,66],[60,82],[48,64],[38,44],[26,60],[16,40],[30,24]]; let n=0;
    $$('.fp-act',sec).forEach(a=>a.onclick=()=>{
      const p=pos[n%pos.length], f=document.createElement('div'); f.className='foot';
      f.style.left=p[0]+'%'; f.style.top=p[1]+'%';
      f.innerHTML=`<span class="fi" style="transform:rotate(${-30+n*8}deg)">👣</span><span class="fl">${a.querySelector('span').textContent} ${a.textContent.replace(a.querySelector('span').textContent,'')}</span>`;
      board.appendChild(f); a.classList.add('used'); n++; cnt.textContent=n; retrigger(cnt.parentElement,'shake'); sound.pop();
    });
    $('.fp-reveal',sec).onclick=()=>{ const d=$('.fp-def',sec); d.classList.toggle('show'); if(d.classList.contains('show')) sound.ding(); };
  }
};

/* التصنيف إلى عمودين */
R.sort = {
  html:s=>{
    const bk=b=>`<button class="bucket" data-b="${b.key}" style="--c:${b.color}"><div class="bk-head"><span class="bk-ic">${b.icon}</span><span>${b.label}</span><span class="bk-count">0</span></div><div class="bk-list"><div class="bk-empty">اضغطي هنا</div></div></button>`;
    return `<p class="lead rv">${s.prompt}</p>
      <div class="sort-wrap rv">${bk(s.buckets[0])}
        <div class="sort-center"><div class="sort-prog"></div><div class="sort-card"></div><div class="sort-hint">👉 اختاري العمود المناسب 👈</div><div class="feedback"></div></div>
        ${bk(s.buckets[1])}</div>`;
  },
  init:(sec,s)=>{
    const card=$('.sort-card',sec), prog=$('.sort-prog',sec), fb=$('.feedback',sec);
    const items=shuffle(s.items.slice()); let i=0;
    const show=()=>{ const it=items[i]; card.innerHTML=`<div class="sc-ic">${it.icon||'❔'}</div><div>${it.t}</div>`; retrigger(card,'enter'); prog.textContent=`${i+1} / ${items.length}`; };
    show();
    $$('.bucket',sec).forEach(b=>b.onclick=()=>{
      if(i>=items.length) return;
      const it=items[i];
      if(it.b===b.dataset.b){
        const list=$('.bk-list',b), e=$('.bk-empty',list); e&&e.remove();
        const chip=document.createElement('div'); chip.className='bk-chip'; chip.textContent=`${it.icon||''} ${it.t}`; list.appendChild(chip);
        const c=$('.bk-count',b); c.textContent=+c.textContent+1;
        i++; setFb(fb,true,MSG.short);
        if(s.pointEach) showAward();
        if(i===items.length){ card.innerHTML=`<div class="sc-ic">🎉</div><div>${MSG.allDone}</div>`; retrigger(card,'enter'); prog.textContent='✓'; $('.sort-hint',sec).style.visibility='hidden'; celebrate(card, s.pointEach); }
        else { sound.ding(); show(); }
      } else { shake(card); sound.wrong(); setFb(fb,false); }
    });
  }
};

/* الكشف التدريجي */

      <div class="rev-content"><div class="rev-ic">${it.icon}</div><div class="rev-t">${it.t}</div>${it.d?`<p>${it.d}</p>`:''}</div></button>`).join('')}</div>

    $$('.rev',sec).forEach(r=>r.onclick=()=>open(r));
    $('.rev-all',sec).onclick=()=>$$('.rev',sec).forEach((r,i)=>setTimeout(()=>open(r),i*250));

/* قيمة دينية: آية + كشف المعاني */

/* سجل الخادم */
R.terminal = {
  html:s=>`<div class="term-wrap">
    <div class="browser rv"><div class="br-bar"><span class="dots"><i></i><i></i><i></i></span><div class="br-url">🔒 ${s.url}</div></div>
      <div class="br-body"><div class="br-ic">🌐</div><p>${s.pageText}</p><button class="btn primary term-go">▶ زيارة الموقع</button></div></div>
    <div class="terminal rv"><div class="term-head"><span>🖥️ خادم الموقع — Server Log</span><span class="rec">● REC</span></div>

    const lines=$('.term-lines',sec), go=$('.term-go',sec);
    go.onclick=()=>{

/* فكّري – زاوجي – شاركي */
R.tps = {
  html:s=>`<div class="q-card big rv"><span class="q-ic">💭</span><p style="font-size:36px">${s.question}</p></div>
    <div class="phases rv">${s.phases.map((p,k)=>`<button class="phase" data-k="${k}" style="--c:${p.color}"><div class="ph-ic">${p.icon}</div><div class="ph-name">${p.name}</div><div class="ph-desc">${p.desc}</div><div class="ph-time">${fmt(p.sec)}</div></button>`).join('<span class="ph-arrow">←</span>')}</div>
    <div class="center-row rv"><button class="btn ghost tps-ans">💡 أفكار مقترحة</button></div>
    <div class="chips tps-chips">${s.answers.map(a=>`<span class="chip">${a}</span>`).join('')}</div>`,
  init:(sec,s)=>{
    const ph=$$('.phase',sec); const cds=s.phases.map((p,k)=>new Countdown(p.sec,l=>{ $('.ph-time',ph[k]).textContent=fmt(l); if(l<=5&&l>0) sound.tick(); },()=>{ ph[k].classList.add('done'); sound.bell(); }));
    ph.forEach((b,k)=>b.onclick=()=>{
      sound.ac();
      if(b.classList.contains('active')){ cds[k].running?cds[k].stop():cds[k].start(); return; }
      cds.forEach((c,j)=>{ if(j!==k) c.stop(); }); ph.forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); if(cds[k].left<=0){ cds[k].reset(); b.classList.remove('done'); } cds[k].start(); sound.pop();
    });
    $('.tps-ans',sec).onclick=()=>{ $('.tps-chips',sec).classList.add('show'); sound.ding(); };
  }
};

/* المقارنة */
R.compare = {
  html:s=>`<div class="cmp rv">
      <div class="cmp-head"><div></div>${s.cols.map(c=>`<div class="cmp-col" style="--c:${c.color}"><div class="cmp-ic">${c.icon}</div><div class="cmp-name">${c.name}</div><div class="cmp-an">${c.analogy}</div></div>`).join('')}</div>
      ${s.rows.map(r=>`<div class="cmp-row"><div class="cmp-k">${r.k}</div><div class="cmp-v">${r.a}</div><div class="cmp-v">${r.b}</div></div>`).join('')}
    </div>
    <div class="center-row rv"><button class="btn primary cmp-next">▶ اعرضي وجه المقارنة التالي</button><button class="btn ghost cmp-all">👀 الكل</button></div>`,
  init:sec=>{
    const rows=$$('.cmp-row',sec), btn=$('.cmp-next',sec); let i=0;
    const step=()=>{ if(i<rows.length){ rows[i++].classList.add('show'); sound.pop(); } if(i>=rows.length){ btn.disabled=true; btn.textContent='✓ اكتملت المقارنة'; } };
    btn.onclick=step; $('.cmp-all',sec).onclick=()=>{ while(i<rows.length) step(); };

/* المطابقة */
R.match = {
  html:s=>{ const order=shuffle(s.pairs.map((_,k)=>k));
    return `<p class="lead rv">${s.prompt}</p>
    <div class="match rv"><div class="m-col">${s.pairs.map((p,k)=>`<button class="m-item term" data-k="${k}">${p.a}</button>`).join('')}</div>
      <div class="m-col">${order.map(k=>`<button class="m-item def" data-k="${k}">${s.pairs[k].b}</button>`).join('')}</div></div>`; },
  init:(sec,s)=>{
    let selT=null, selD=null, done=0; const lead=$('.lead',sec);
    const tryPair=()=>{
      if(!selT||!selD) return;
      const a=selT, b=selD; selT=selD=null; a.classList.remove('sel'); b.classList.remove('sel');
      if(a.dataset.k===b.dataset.k){
        done++; const c=PALETTE[(done-1)%PALETTE.length];
        [a,b].forEach(x=>{ x.classList.add('matched'); x.style.setProperty('--mc',c); x.dataset.badge=done; });
        if(done===s.pairs.length){ lead.innerHTML='🎉 '+MSG.allDone; lead.classList.add('ok-text'); celebrate($('.match',sec)); } else sound.ding();
      } else { shake(a); shake(b); sound.wrong(); }
    };
    const pick=(el,isTerm)=>{
      if(isTerm){ if(selT) selT.classList.remove('sel'); selT = selT===el?null:el; selT&&selT.classList.add('sel'); }
      else      { if(selD) selD.classList.remove('sel'); selD = selD===el?null:el; selD&&selD.classList.add('sel'); }
      tryPair();
    };
    $$('.term',sec).forEach(t=>t.onclick=()=>pick(t,true));
    $$('.def',sec).forEach(d=>d.onclick=()=>pick(d,false));
  }
};

/* صح أم خطأ */
R.tf = {
  html:s=>`<div class="tf-list">${s.items.map((it,k)=>`<div class="tf-row rv" data-k="${k}"><div class="tf-n">${k+1}</div>
      <div><p class="tf-t">${it.t}</p><div class="tf-why"></div></div>
      <div class="tf-btns"><button class="tf-b yes" data-v="1">✔ صح</button><button class="tf-b no" data-v="0">✖ خطأ</button></div></div>`).join('')}</div>`,
  init:(sec,s)=>{
    $$('.tf-row',sec).forEach(row=>{
      const it=s.items[+row.dataset.k], why=$('.tf-why',row);
      $$('.tf-b',row).forEach(b=>b.onclick=()=>{
        if((b.dataset.v==='1')===it.a){
          row.classList.add('solved'); b.classList.add('right'); why.className='tf-why show'; why.innerHTML='✓ '+(it.why||MSG.correct);
          celebrate(b, s.noPoints);
        } else { shake(row); sound.wrong(); why.className='tf-why show bad'; why.textContent=MSG.wrong; }
      });
    });
  }
};

/* مهام المجموعات (كل مجموعة بلونها) */
R.groups = {
  html:s=>`<div class="grp-top rv"><p class="lead">${s.prompt}</p><div class="timer-slot"></div></div>
    <div class="cards grp8 rv" style="--n:3;--h:270px">${LESSON.teams.map((g,k)=>`<div class="fc-wrap"><button class="fc" style="--c:${g.color}">
      <div class="fc-face fc-front"><div class="fc-ic">${g.icon}</div><div class="fc-title">${g.name}</div><div class="fc-hint">اضغطي لكشف المهمة 🎯</div></div>
      <div class="fc-face fc-back"><p>${(s.tasks||[])[k]||'مهمة حرة تحددها المعلمة'}</p></div></button></div>`).join('')}</div>`,
