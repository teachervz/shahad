/* لوحة الصدارة */
R.leaderboard = {
  html:()=>`<div class="lb rv"></div><div class="center-row rv"><button class="btn primary lg lb-go">🥁 أعلني الفائز</button></div>`,
  draw(sec, reveal){
    const max=Math.max(1,...scores), top=Math.max(...scores);
    const order=LESSON.teams.map((t,k)=>k).sort((a,b)=>scores[b]-scores[a]);
    $('.lb',sec).innerHTML=order.map((k,pos)=>{ const t=LESSON.teams[k], win=reveal&&top>0&&scores[k]===top;
      return `<div class="lb-row ${win?'win':''}" style="--c:${t.color}"><span class="lb-pos">${win?'👑':pos+1}</span><span class="lb-name">${t.icon} ${t.name}</span>
        <div class="lb-track"><div class="lb-bar" style="width:${reveal?Math.max(4,scores[k]/max*100):4}%"></div></div><span class="lb-pts">${reveal?scores[k]:'؟'}</span></div>`; }).join('');
  },
  init:sec=>{ $('.lb-go',sec).onclick=()=>{
    R.leaderboard.draw(sec,true); sound.success(); setTimeout(()=>confetti.rain(220),300);
    const w=$('.lb-row.win .lb-name',sec); if(w) $('.lb-go',sec).textContent='🏆 الفائز: '+[...$$('.lb-row.win .lb-name',sec)].map(x=>x.textContent).join(' و ');
  }; },
  enter:sec=>{ R.leaderboard.draw(sec,false); const b=$('.lb-go',sec); b.textContent='🥁 أعلني الفائز'; }
};

/* تحدي الدقيقة */
R.challenge = {
  html:s=>`<div class="ch-wrap">
    <div class="ch-left rv"><div class="timer-slot"></div><div class="ch-score">✅ إجابات صحيحة: <b>0</b></div></div>
    <div class="rv"><div class="ch-card"><div class="ch-num"></div><p class="ch-q"></p><div class="ch-a"></div></div>
      <div class="ch-btns"><button class="btn ghost ch-show">👀 الإجابة</button><button class="btn ok ch-plus">✓ صحيحة +1</button><button class="btn primary ch-next">السؤال التالي ⬅</button></div></div></div>`,
  init:(sec,s)=>{
    let i=0, score=0; const q=$('.ch-q',sec), a=$('.ch-a',sec), num=$('.ch-num',sec), sc=$('.ch-score b',sec), plus=$('.ch-plus',sec);
    const show=()=>{ num.textContent=`السؤال ${i+1} من ${s.questions.length}`; q.textContent=s.questions[i].q; a.textContent='💡 '+s.questions[i].a; a.classList.remove('show'); plus.disabled=false; retrigger(q,'enter'); };
    show();
    $('.ch-show',sec).onclick=()=>{ a.classList.add('show'); sound.pop(); };
    plus.onclick=()=>{ score++; sc.textContent=score; plus.disabled=true; retrigger(sc,'shake'); sound.ding(); showAward(1); };
    $('.ch-next',sec).onclick=()=>{ i=(i+1)%s.questions.length; show(); };
    mountTimer($('.timer-slot',sec), s.seconds||60, { big:true,
      onEnd:()=>{ num.textContent='⏰ انتهى الوقت!'; q.textContent=`النتيجة: ${score} إجابات صحيحة`; a.classList.remove('show'); if(score>0) confetti.burst(innerWidth/2,innerHeight/2,120); },
      onReset:()=>{ score=0; sc.textContent=0; i=0; show(); } });
  }
};

/* خريطة المراجعة */
R.review = {
  html:s=>{
    const n=s.nodes.length, pts=s.nodes.map((_,k)=>{ const a=(k*360/n-90)*Math.PI/180; return [50+Math.cos(a)*40, 50+Math.sin(a)*40]; });
    return `<div class="map rv">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">${pts.map(p=>`<line x1="50" y1="50" x2="${p[0]}" y2="${p[1]}"/>`).join('')}</svg>
      ${s.nodes.map((nd,k)=>`<button class="node" data-k="${k}" style="left:${pts[k][0]}%;top:${pts[k][1]}%;--c:${nd.color}">${nd.icon} ${nd.t}</button>`).join('')}
      <div class="map-center"><div class="mc-ic">${s.center.icon}</div><div class="mc-t">${s.center.t}</div><div class="mc-d">${s.center.d}</div></div></div>`;
  },
  init:(sec,s)=>{
    const c=$('.map-center',sec);
    $$('.node',sec).forEach(nb=>nb.onclick=()=>{

    </div>
    <div class="qz-end"><div class="qs-ic">🏆</div><h2 class="title" style="text-align:center">أحسنتنّ! انتهى التقويم الختامي</h2><p class="qz-score"></p><button class="btn ghost qz-again">↺ إعادة اللعبة</button></div>
  </div>`,
  init:(sec,s)=>{
    const qz=$('.qz',sec), fb=$('.feedback',sec), dots=$$('.qz-dots i',sec), bar=$('.qz-bar i',sec), secEl=$('.qz-sec',sec), nextB=$('.qz-next',sec);
    const T=s.seconds||20; let i=0, ok=0, done=false, cd=null;
    const stop=()=>cd&&cd.stop();
    const show=()=>{
      const q=s.questions[i]; done=false; fb.textContent=''; fb.className='feedback'; nextB.style.visibility='hidden';
      dots.forEach((d,k)=>d.classList.toggle('cur',k===i));
      $('.qz-q',sec).textContent=q.q; retrigger($('.qz-q',sec).parentElement,'pop');
      const box=$('.qz-opts',sec);

      $$('.opt',box).forEach(b=>b.onclick=()=>{
        if(done) return;
        if(+b.dataset.k===q.a){
          done=true; stop(); ok++; b.classList.add('correct'); $$('.opt',box).forEach(o=>o!==b&&o.classList.add('dim'));
          dots[i].classList.add('ok'); setFb(fb,true); celebrate(b); nextB.style.visibility='visible';
        } else { b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); setFb(fb,false); sound.wrong(); }
      });
      stop(); bar.style.transition='none'; bar.style.width='100%'; secEl.textContent=T; void bar.offsetWidth; bar.style.transition='';
      cd=new Countdown(T, l=>{ secEl.textContent=l; bar.style.width=(l/T*100)+'%'; if(l<=5&&l>0) sound.tick(); }, ()=>{
        if(done) return; done=true; dots[i].classList.add('miss');

        setFb(fb,false,'⏰ انتهى الوقت! هذه هي الإجابة الصحيحة'); sound.bell(); nextB.style.visibility='visible';
      });
      cd.start();
    };
    const start=()=>{ i=0; ok=0; dots.forEach(d=>d.className=''); qz.classList.remove('ended'); qz.classList.add('playing'); sound.ac(); show(); };
    $('.qz-go',sec).onclick=start; $('.qz-again',sec).onclick=start;
    nextB.onclick=()=>{
      if(i<s.questions.length-1){ i++; show(); return; }
      stop(); qz.classList.remove('playing'); qz.classList.add('ended');
      $('.qz-score',sec).textContent=`أجبتنّ عن ${ok} من ${s.questions.length} أسئلة في الوقت المحدد 🎉`; confetti.rain(200); sound.success();
    };
  }
};

// اسم العرض: الاسم الأول + الأخير، وإذا تكرر عند أكثر من طالبة يُضاف اسم الأب
const STUDENT_NAME=(()=>{
  const parts=n=>n.trim().split(/\s+/).filter(w=>w!=='بنت'&&w!=='بن');
  const fl=n=>{ const w=parts(n); return w.length>1?w[0]+' '+w[w.length-1]:w[0]; };
  const count={}; LESSON.students.forEach(n=>count[fl(n)]=(count[fl(n)]||0)+1);
  const out={}; LESSON.students.forEach(n=>{ const w=parts(n); out[n]=count[fl(n)]>1&&w.length>2?w[0]+' '+w[1]+' '+w[w.length-1]:fl(n); });
  return out;
})();
function mountWheel(slot, size){
  slot.innerHTML=`<div class="wheel" ${size?`style="--ws:${size}px"`:''}><div class="wh-box"><div class="wh-ptr"></div><canvas width="1100" height="1100"></canvas><button class="wh-hub">لفّي</button></div>
    <div class="wh-res">🎡 من ستجيب؟</div>
    <div class="wh-opts"><label><input type="checkbox" class="wh-rm" checked> استبعاد الاسم بعد اختياره</label><button class="wh-reset">↺ كل الأسماء</button></div></div>`;
  const cv=$('canvas',slot), cx=cv.getContext('2d'), hub=$('.wh-hub',slot), res=$('.wh-res',slot);
  let names=LESSON.students.slice(), rot=0, pending=null;
  const short=n=>STUDENT_NAME[n]||n;
  const draw=()=>{
    const W=cv.width, c=W/2, r=c-6, n=names.length, a=2*Math.PI/Math.max(n,1);
    cx.clearRect(0,0,W,W);
    names.forEach((nm,k)=>{
      const s0=-Math.PI/2+k*a;
      cx.beginPath(); cx.moveTo(c,c); cx.arc(c,c,r,s0,s0+a); cx.closePath();
      cx.fillStyle=PALETTE[k%PALETTE.length]; cx.fill(); cx.strokeStyle='#fff'; cx.lineWidth=3; cx.stroke();
      cx.save(); cx.translate(c,c); cx.rotate(s0+a/2); cx.fillStyle='#fff';
      cx.font=`800 ${n>24?34:n>14?38:44}px Cairo, Tahoma, sans-serif`; cx.textAlign='right'; cx.textBaseline='middle'; cx.direction='rtl';
      cx.fillText(short(nm), r-24, 2); cx.restore();
    });
    if(!n){ cx.fillStyle='#EDE9FE'; cx.beginPath(); cx.arc(c,c,r,0,7); cx.fill(); }
  };
  draw();
  hub.onclick=()=>{
    if(pending!==null && $('.wh-rm',slot).checked){ names.splice(pending,1); draw(); }
    pending=null;
    if(!names.length){ res.textContent='انتهت الأسماء 🎉 اضغطي «كل الأسماء»'; return; }
    sound.ac(); hub.disabled=true;
    const n=names.length, deg=360/n, pick=Math.floor(Math.random()*n);
    // الدوران بحيث يقف منتصف شريحة الاسم المختار تحت المؤشر
    const target=360-(pick*deg+deg/2) + (Math.random()-.5)*deg*.6;
    rot += 360*6 + ((target-rot)%360+360)%360;
    cv.style.transform=`rotate(${rot}deg)`;
    res.textContent='…'; let t=0; const tick=()=>{ if(t>4600) return; sound.tick(); t+=60+t/12; setTimeout(tick,60+t/12); }; tick();
    setTimeout(()=>{ hub.disabled=false; pending=pick; res.textContent='🌟 '+short(names[pick]); retrigger(res,'pop'); celebrate(res,true); },5300);
  };
  $('.wh-reset',slot).onclick=()=>{ names=LESSON.students.slice(); pending=null; draw(); res.textContent='🎡 من ستجيب؟'; };
}

/* ---------------- 🧱 بناء الشرائح ---------------- */
const stage=$('#stage'); const slides=[]; let current=0;
const ANIMS=['slide','fade','zoom'];
SLIDES.forEach((s,i)=>{
  const r=R[s.type]; if(!r){ console.warn('نوع شريحة غير معروف:',s.type); return; }
  const sec=document.createElement('section'); sec.className='slide t-'+s.type;
  const head=(s.tag?`<div class="tag rv">${s.tag}</div>`:'')+(s.title&&!['title','closing','section','cover'].includes(s.type)?`<h2 class="title rv">${s.title}</h2>`:'')
    +(s.subline?`<div class="act rv"><span>${s.subline}</span></div>`:'')
    +(s.act?`<div class="act rv"><span>📄 ورقة عمل • نشاط <b>${s.act.n}</b></span><span>⏱️ المدة: <b>${s.act.time}</b></span><span>👥 <b>${s.act.kind}</b></span>${s.act.goal?`<span>🎯 ${s.act.goal}</span>`:''}</div>`:'');
  sec.innerHTML=`<div class="slide-inner">${head}<div class="content">${r.html(s,i)}</div></div>`;
  stage.appendChild(sec);
  $$('.rv',sec).forEach((el,k)=>el.style.setProperty('--i',Math.min(k,9)));
  r.init&&r.init(sec,s,i);
  slides.push({el:sec,cfg:s,r});
});
$('#brand').textContent=`${LESSON.lessonNo}: ${LESSON.title}`;

/* ---------------- 🧭 التنقل ---------------- */
function go(n){
  if(n<0||n>=slides.length) return;
  const dir=n>=current?1:-1, old=slides[current].el, nw=slides[n].el;
  $$('video,audio',old).forEach(v=>v.pause());
  if(n!==current){ old.classList.remove('active'); retrigger(old,'leaving'); setTimeout(()=>old.classList.remove('leaving'),460); }
  const anim=slides[n].cfg.anim||ANIMS[n%ANIMS.length];
  nw.classList.remove('in-fade','in-zoom','in-slide-next','in-slide-prev','active'); void nw.offsetWidth;
  nw.classList.add('active','in-'+(anim==='slide'?(dir>0?'slide-next':'slide-prev'):anim));
  current=n; updateUI();
  slides[n].r.enter&&slides[n].r.enter(nw,slides[n].cfg);
}
const next=()=>go(current+1), prev=()=>go(current-1);
function updateUI(){
  $('#counter').innerHTML=`<b>${current+1}</b> / ${slides.length}`;
  $('#pgnum').textContent=`${current+1} / ${slides.length}`;
  $('#progress i').style.width=((current+1)/slides.length*100)+'%';
  $('#prev').disabled=current===0; $('#next').disabled=current===slides.length-1;
}

/* ---------------- 📐 ملاءمة الشاشة 16:9 ---------------- */
function fit(){ const s=Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener('resize',fit); fit();

/* ---------------- ⌨️ لوحة المفاتيح ---------------- */
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')){ if(e.key==='Escape') e.target.blur(); return; }
  const k=e.key;
  if(k==='ArrowRight'||k===' '||e.code==='Space'||k==='PageDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); prev(); }
  else if(k==='ArrowUp'||k==='ArrowDown'){ e.preventDefault(); }
  else if(k==='ت'||e.code==='KeyF'){ e.preventDefault(); clap(); }
  else if(k==='Home'){ e.preventDefault(); go(0); }
  else if(k==='End'){ e.preventDefault(); go(slides.length-1); }
});
document.addEventListener('keyup',e=>{ if((e.key===' '||e.code==='Space')&&!e.target.matches('input,textarea')) e.preventDefault(); });
// إزالة التركيز عن الأزرار بعد الضغط حتى لا يضغطها زر Space مرة أخرى
document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) setTimeout(()=>b.blur(),0); });
addEventListener('wheel',e=>e.preventDefault(),{passive:false});

/* سحب باللمس (للسبورة الذكية) */
let tx=null, ty=null;
stage.addEventListener('touchstart',e=>{ if(e.target.closest('input')) return; tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
stage.addEventListener('touchend',e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; tx=null;
  if(Math.abs(dx)>140&&Math.abs(dy)<80){ dx<0?next():prev(); } });

/* ---------------- 🎛️ أزرار الشريط ---------------- */
$('#next').onclick=next; $('#prev').onclick=prev; $('#clapBtn').onclick=clap;
mountWheel($('#wheelModal .wm-slot'), 720);
$('#wheelBtn').onclick=()=>$('#wheelModal').classList.toggle('open');
$('#wheelModal .wm-close').onclick=()=>$('#wheelModal').classList.remove('open');
$('#fsBtn').onclick=()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); else document.exitFullscreen(); };

/* إخفاء الشريط تلقائيًا عند عدم تحريك الماوس */
let idleT;
function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT);
  idleT=setTimeout(()=>{ if(!$('#bar').matches(':hover')&&!$('#score').classList.contains('open')) document.body.classList.add('idle'); },2800); }
['mousemove','mousedown','touchstart'].forEach(ev=>addEventListener(ev,wake,{passive:true})); wake();

/* ---------------- 🏆 تنافس المجموعات ---------------- */
const scores=LESSON.teams.map(()=>0);
function addPoints(k,d){
  scores[k]=Math.max(0,scores[k]+d); drawScores(k);
  const chip=$(`#teams .tm[data-k="${k}"]`); chip&&retrigger(chip,'bump');
}
function drawScores(bumpIdx){
  const max=Math.max(...scores);
  // اللوحة الجانبية الكاملة
  $('#scList').innerHTML=LESSON.teams.map((t,k)=>`<div class="sc-row" style="--c:${t.color}"><span class="crown">${max>0&&scores[k]===max?'👑':''}</span>
    <span class="sc-name">${t.icon} ${t.name}</span><button data-k="${k}" data-d="-1">−</button><span class="sc-pts ${k===bumpIdx?'bump':''}">${scores[k]}</span><button data-k="${k}" data-d="1">＋</button></div>`).join('');
  // الشريط العلوي الدائم
  $('#teams').innerHTML=LESSON.teams.map((t,k)=>`<button class="tm ${max>0&&scores[k]===max?'lead':''}" data-k="${k}" style="--c:${t.color}" title="${t.name}">
    <span class="tm-ic">${max>0&&scores[k]===max?'👑':t.icon}</span><b>${scores[k]}</b></button>`).join('');
}
$('#scList').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const d=+b.dataset.d; addPoints(+b.dataset.k,d); d>0?sound.ding():sound.pop(); });
$('#teams').addEventListener('click',()=>$('#score').classList.add('open'));
$('#scoreBtn').onclick=()=>$('#score').classList.toggle('open');
$('#scClose').onclick=()=>$('#score').classList.remove('open');
$('#scReset').onclick=()=>{ if(confirm('تصفير نقاط جميع المجموعات؟')){ scores.fill(0); drawScores(); } };
drawScores();

/* نافذة «أي مجموعة أجابت؟» — تظهر بعد كل إجابة صحيحة */
let awardT;
function showAward(pts){
  pts = pts || slides[current].cfg.points || LESSON.defaultPoints || 1;
  const box=$('#award');
  $('#awPts').textContent='+'+pts;
  $('#awBtns').innerHTML=LESSON.teams.map((t,k)=>`<button data-k="${k}" style="--c:${t.color}" title="${t.name}"><span>${t.icon}</span><small>${t.name}</small></button>`).join('');
  $$('#awBtns button').forEach(b=>b.onclick=()=>{
    addPoints(+b.dataset.k,pts); sound.ding();
    const r=b.getBoundingClientRect(); confetti.burst(r.left+r.width/2,r.top,30);
    box.classList.remove('open');
  });
  box.classList.add('open'); clearTimeout(awardT); awardT=setTimeout(()=>box.classList.remove('open'),15000);
}
$('#awClose').onclick=()=>$('#award').classList.remove('open');

/* ---------------- ▶️ البداية ---------------- */
go(0);
</script>
</body>
</html>
